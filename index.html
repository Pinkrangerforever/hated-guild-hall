window._layoutState = {
  locked: true,
  dragging: null,
  dragType: null,
  dragStart: { x: 0, y: 0 },
  dragStartPos: { x: 0, y: 0 }
};

// Global cache for layout data to apply at render time
let layoutCache = null;

async function loadLayout(){
  try {
    // Load layout from Supabase (shared for all users)
    const { data, error } = await sb.from('guild_layout').select('layout_data').eq('guild_id', 'hated').single();

    if(error && error.code !== 'PGRST116') { // PGRST116 = no rows found
      console.error('Error loading layout:', error);
      return;
    }

    if(data && data.layout_data){
      try {
        layoutCache = JSON.parse(data.layout_data);
        // Apply to DOM if elements exist (for post-render updates)
        applyLayoutStyles(layoutCache);
      } catch(e) {
        console.error('Error parsing layout:', e);
      }
    }

    // Only sync title positions for raid leaders (members use saved positions)
    if(testIsRaidLeader()) {
      setTimeout(() => syncTitlePositions(), 0);
    }
  } catch(e) {
    console.error('Error in loadLayout:', e);
  }
}

function applyLayoutStyles(layout) {
  if(!layout) return;
  Object.entries(layout).forEach(([id, style]) => {
    const el = document.getElementById(id);
    if(el) {
      const { type, ...styleProps } = style;
      // Remove type field before applying styles
      Object.entries(styleProps).forEach(([prop, value]) => {
        if(value) {
          el.style[prop] = value;
        }
      });
      if(style.left || style.top || style.right) {
        el.style.position = 'absolute';
      }
    }
  });
}

function getLayoutStyleString(elementId) {
  if(!layoutCache || !layoutCache[elementId]) return '';
  const style = layoutCache[elementId];
  const { type, ...styleProps } = style;
  return Object.entries(styleProps).filter(([k, v]) => v).map(([k, v]) => `${k}:${v}`).join(';');
}

function syncTitlePositions(){
  // Members should never sync - they use saved positions only
  if(!testIsRaidLeader()) return;

  // Only sync titles that don't have manually-set positions
  const titleBoxMap = {
    'module-raid-roster-title': { box: 'wow-box-3', side: 'right' }
  };

  Object.entries(titleBoxMap).forEach(([titleId, config]) => {
    const title = document.getElementById(titleId);
    const box = document.getElementById(config.box);

    if(title && box) {
      // Skip sync if title has explicit saved position (top/left/right set)
      const hasExplicitPosition = title.style.top || title.style.left || title.style.right;
      if(hasExplicitPosition) {
        return; // Title was manually positioned and saved, don't override
      }

      // Sync to box position
      const boxTop = parseInt(box.style.top) || 0;
      const boxLeft = parseInt(box.style.left);
      const boxRight = parseInt(box.style.right);

      title.style.top = (boxTop + 20) + 'px';

      if(config.side === 'right') {
        // Right-positioned: use right property or calculate from left
        if(!isNaN(boxRight)) {
          title.style.right = (boxRight + 40) + 'px';
        } else if(!isNaN(boxLeft)) {
          // Box was positioned with left, calculate from right
          const boxWidth = box.offsetWidth;
          const rightDist = boxLeft + boxWidth;
          title.style.right = (rightDist - 40) + 'px';
        }
        title.style.left = 'auto';
      } else {
        // Left-positioned
        if(!isNaN(boxLeft)) {
          title.style.left = (boxLeft + 40) + 'px';
        }
        title.style.right = 'auto';
      }
    }
  });
}

async function initLayoutSystem(){
  // Load layout for ALL users (not just raid leaders)
  // If layout was already loaded before render, just apply to DOM elements that now exist
  if(!layoutCache) {
    await loadLayout();
  } else {
    // Layout was already cached, just apply to DOM elements
    applyLayoutStyles(layoutCache);
  }

  // Only initialize drag/edit controls for raid leaders
  if(!testIsRaidLeader()) return;

  const lockBtn = document.getElementById('layout-lock-btn');
  const resetBtn = document.getElementById('layout-reset-btn');
  if(!lockBtn || !resetBtn) return;

  lockBtn.addEventListener('click', async () => {
    if(!window._layoutState.locked) {
      // Locking: save current positions to Supabase
      await saveLayout();
    }
    window._layoutState.locked = !window._layoutState.locked;
    lockBtn.textContent = window._layoutState.locked ? ' Unlock Layout' : ' Lock Layout';
    lockBtn.classList.toggle('locked');

    // Toggle .unlocked class on all modules to show/hide resize handles
    document.querySelectorAll('.module').forEach(mod => {
      if(window._layoutState.locked) {
        mod.classList.remove('unlocked');
      } else {
        mod.classList.add('unlocked');
      }
    });
  });

  resetBtn.addEventListener('click', () => {
    if(!confirm('⚠️ Reset layout for ALL users? This will remove all saved module positions. Everyone will see the default layout on next refresh.')) {
      return;
    }
    // Clear saved layout from Supabase for all users
    sb.from('guild_layout').delete().eq('guild_id', 'hated').then(() => {
      location.reload();
    });
  });

  const layoutContainer = document.getElementById('layout-container');

  // WOW-CONTAINER DRAG AND RESIZE LOGIC
  let isDraggingContainer = false;
  let isResizingContainer = false;
  let dragStartX, dragStartY, dragStartLeft, dragStartTop;
  let resizeStartWidth, resizeStartHeight, resizeStartX, resizeStartY;
  let currentContainer = null;

  // Setup drag/resize for all wow-containers
  document.addEventListener('mousedown', (e) => {
    if(window._layoutState.locked) return;

    const resizeHandle = e.target.closest('.wow-resize-handle');
    if(resizeHandle) {
      e.preventDefault();
      isResizingContainer = true;
      currentContainer = resizeHandle.closest('.wow-container');
      if(!currentContainer) return;

      resizeStartX = e.pageX;
      resizeStartY = e.pageY;
      resizeStartWidth = currentContainer.offsetWidth;
      resizeStartHeight = currentContainer.offsetHeight;

      currentContainer.classList.add('dragging');
      return;
    }

    // Titleplate resize handle
    const titleplateResizeHandle = e.target.closest('.titleplate-resize-handle');
    if(titleplateResizeHandle) {
      e.preventDefault();
      isResizingContainer = true;
      currentContainer = titleplateResizeHandle.closest('.titleplate-container');
      if(!currentContainer) return;

      resizeStartX = e.pageX;
      resizeStartY = e.pageY;
      resizeStartWidth = currentContainer.offsetWidth;
      resizeStartHeight = currentContainer.offsetHeight;

      currentContainer.classList.add('dragging');
      return;
    }

    // Guild board resize handle (maintains aspect ratio)
    const guildBoardResizeHandle = e.target.closest('.guild-board-resize-handle');
    if(guildBoardResizeHandle) {
      e.preventDefault();
      isResizingContainer = true;
      currentContainer = guildBoardResizeHandle.closest('.guild-board-container');
      if(!currentContainer) return;

      resizeStartX = e.pageX;
      resizeStartY = e.pageY;
      resizeStartWidth = currentContainer.offsetWidth;
      resizeStartHeight = currentContainer.offsetHeight;

      currentContainer.classList.add('dragging');
      currentContainer.dataset.aspectRatio = resizeStartWidth / resizeStartHeight;
      return;
    }

    // Module resize handle (roster)
    const moduleResizeHandle = e.target.closest('.module-resize-handle');
    if(moduleResizeHandle) {
      e.preventDefault();
      isResizingContainer = true;
      currentContainer = moduleResizeHandle.closest('.module');
      if(!currentContainer) return;

      resizeStartX = e.pageX;
      resizeStartWidth = currentContainer.offsetWidth;
      currentContainer.classList.add('dragging');
      return;
    }

    // Check if clicking on the frame itself (not interactive elements)
    const isInteractive = e.target.closest('button') || e.target.closest('input') ||
                         e.target.closest('textarea') || e.target.closest('select') ||
                         e.target.closest('a');

    if(!isInteractive) {
      const container = e.target.closest('.wow-container');
      if(container && container.classList.contains('unlocked')) {
        isDraggingContainer = true;
        currentContainer = container;
        dragStartX = e.pageX;
        dragStartY = e.pageY;
        dragStartLeft = parseInt(currentContainer.style.left) || 0;
        dragStartTop = parseInt(currentContainer.style.top) || 0;
        currentContainer.classList.add('dragging');
        return;
      }
    }

    // Titleplate dragging
    if(!isInteractive) {
      const titleplate = e.target.closest('.titleplate-container');
      if(titleplate && titleplate.classList.contains('unlocked')) {
        isDraggingContainer = true;
        currentContainer = titleplate;
        dragStartX = e.pageX;
        dragStartY = e.pageY;
        dragStartLeft = parseInt(currentContainer.style.left) || 0;
        dragStartTop = parseInt(currentContainer.style.top) || 0;
        currentContainer.classList.add('dragging');
        return;
      }
    }

    // Module dragging (existing logic)
    if(!isInteractive) {
      // Don't start drag if clicking on a resize handle
      if(e.target.closest('.announcement-resize-handle') || e.target.closest('.divider-resize-handle') || e.target.closest('.trophy-image-resize-handle') || e.target.closest('.roster-resize-handle') || e.target.closest('.shop-poster-resize-handle')) {
        return;
      }
      const mod = e.target.closest('.module');
      if(mod && mod.id) {
        window._layoutState.dragging = mod;
        window._layoutState.dragType = 'module';
        startDrag(e, mod);
        return;
      }
    }
  });

  function startDrag(e, el){
    window._layoutState.dragStart = { x: e.pageX, y: e.pageY };

    const rect = el.getBoundingClientRect();
    const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    const docX = rect.left + scrollLeft;
    const docY = rect.top + scrollTop;

    let offsetParent = el.offsetParent;
    let parentDocX = 0;
    let parentDocY = 0;

    if(offsetParent){
      const parentRect = offsetParent.getBoundingClientRect();
      parentDocX = parentRect.left + scrollLeft;
      parentDocY = parentRect.top + scrollTop;
    }

    // For transformed elements, work entirely in DOM coordinates
    const currentLeft = parseInt(el.style.left) || 0;
    const currentTop = parseInt(el.style.top) || 0;

    // Store starting position and mouse position for delta calculation
    window._layoutState.dragStartPos = {
      x: currentLeft,
      y: currentTop
    };
    window._layoutState.dragStartMouse = {
      x: e.pageX,
      y: e.pageY
    };

    el.classList.add('dragging');
    el.style.margin = '0';
    el.style.position = 'absolute';
    el.style.zIndex = '100';

    window._layoutState.dragOriginalDisplay = el.style.display;
    window._layoutState.dragOriginalFlexGap = el.style.gap;
    window._layoutState.dragOriginalWidth = el.style.width;
    window._layoutState.dragOriginalHeight = el.style.height;

    const dragRect = el.getBoundingClientRect();
    el.style.width = dragRect.width + 'px';
    el.style.height = dragRect.height + 'px';

    if(el.style.display === 'flex' || window.getComputedStyle(el).display === 'flex'){
      el.style.gap = '0';
      el.style.flexWrap = 'nowrap';
      el.style.justifyContent = 'flex-start';

      window._layoutState.dragChildrenFlexes = [];
      Array.from(el.children).forEach(child => {
        window._layoutState.dragChildrenFlexes.push(child.style.flex);
        child.style.flex = 'none';
      });
    }
  }

  document.addEventListener('mousemove', (e) => {
    // Handle wow-container resize
    if(isResizingContainer && currentContainer) {
      if(currentContainer.classList.contains('guild-board-container')) {
        // Guild board scale - both width and height scale by same factor (check FIRST since it also has 'module' class)
        const deltaX = e.pageX - resizeStartX;
        const deltaY = e.pageY - resizeStartY;
        // Use diagonal magnitude for scaling
        const magnitude = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const direction = (deltaX + deltaY) >= 0 ? 1 : -1;
        const scaleDelta = magnitude * direction;

        // Apply scale factor to both dimensions
        const scaleFactor = 1 + (scaleDelta / resizeStartWidth);
        const newW = Math.max(400, Math.round(resizeStartWidth * scaleFactor));
        const newH = Math.max(300, Math.round(resizeStartHeight * scaleFactor));

        currentContainer.style.width = newW + 'px';
        currentContainer.style.height = newH + 'px';
      } else if(currentContainer.classList.contains('module')) {
        // Module resize - only width
        const newW = Math.max(300, resizeStartWidth + (e.pageX - resizeStartX));
        currentContainer.style.width = newW + 'px';
      } else {
        // WOW-container or titleplate resize - width and height
        const newW = Math.max(150, resizeStartWidth + (e.pageX - resizeStartX));
        const newH = Math.max(80, resizeStartHeight + (e.pageY - resizeStartY));
        currentContainer.style.width = newW + 'px';
        currentContainer.style.height = newH + 'px';
      }
      return;
    }

    // Handle wow-container drag
    if(isDraggingContainer && currentContainer) {
      const dx = e.pageX - dragStartX;
      const dy = e.pageY - dragStartY;
      currentContainer.style.left = (dragStartLeft + dx) + 'px';
      currentContainer.style.top = (dragStartTop + dy) + 'px';
      // Sync titles as box is dragged (raid leader only)
      if(testIsRaidLeader()) {
        syncTitlePositions();
      }
      return;
    }

    // Handle module drag
    if(!window._layoutState.dragging) return;

    const el = window._layoutState.dragging;

    // Simple delta-based approach works with transforms
    const dx = e.pageX - window._layoutState.dragStartMouse.x;
    const dy = e.pageY - window._layoutState.dragStartMouse.y;

    el.style.left = (window._layoutState.dragStartPos.x + dx) + 'px';
    el.style.top = (window._layoutState.dragStartPos.y + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    // Stop container operations
    if(isResizingContainer || isDraggingContainer) {
      if(currentContainer) {
        currentContainer.classList.remove('dragging');
        // Sync titles with new box position (raid leader only)
        if(testIsRaidLeader()) {
          syncTitlePositions();
        }
      }
      isResizingContainer = false;
      isDraggingContainer = false;
      currentContainer = null;
      return;
    }

    // Stop module drag (existing logic)
    if(!window._layoutState.dragging) return;
    const el = window._layoutState.dragging;
    el.classList.remove('dragging');

    if(window._layoutState.dragOriginalDisplay !== undefined){
      el.style.display = window._layoutState.dragOriginalDisplay;
      el.style.gap = window._layoutState.dragOriginalFlexGap;
      el.style.width = window._layoutState.dragOriginalWidth;
      el.style.height = window._layoutState.dragOriginalHeight;
      window._layoutState.dragOriginalDisplay = undefined;
      window._layoutState.dragOriginalFlexGap = undefined;
      window._layoutState.dragOriginalWidth = undefined;
      window._layoutState.dragOriginalHeight = undefined;
    }

    if(window._layoutState.dragChildrenFlexes){
      const children = Array.from(el.children);
      children.forEach((child, idx) => {
        child.style.flex = window._layoutState.dragChildrenFlexes[idx] || '';
      });
      window._layoutState.dragChildrenFlexes = undefined;
    }

    window._layoutState.dragging = null;
    window._layoutState.dragType = null;
    window._layoutState.clickOffset = null;
  });

  async function saveLayout(){
    const layout = {};

    // Save wow-containers (resizable and movable)
    document.querySelectorAll('.wow-container').forEach(el => {
      if(el.id) {
        layout[el.id] = {
          left: el.style.left,
          top: el.style.top,
          width: el.style.width,
          height: el.style.height,
          zIndex: el.style.zIndex,
          type: 'container'
        };
      }
    });

    // Save titleplate-containers (resizable and movable)
    document.querySelectorAll('.titleplate-container').forEach(el => {
      if(el.id) {
        layout[el.id] = {
          left: el.style.left,
          top: el.style.top,
          width: el.style.width,
          height: el.style.height,
          zIndex: el.style.zIndex,
          type: 'titleplate'
        };
      }
    });

    // Save divider line containers (with transform support)
    document.querySelectorAll('.divider-line-container').forEach(el => {
      if(el.id) {
        layout[el.id] = {
          left: el.style.left,
          top: el.style.top,
          width: el.style.width,
          height: el.style.height,
          transform: el.style.transform,
          zIndex: el.style.zIndex,
          type: 'divider'
        };
      }
    });

    // Save announcements display module (resizable)
    const announcementsDisplay = document.getElementById('module-announcements-display');
    if(announcementsDisplay) {
      layout['module-announcements-display'] = {
        left: announcementsDisplay.style.left,
        top: announcementsDisplay.style.top,
        width: announcementsDisplay.style.width,
        height: announcementsDisplay.style.height,
        zIndex: announcementsDisplay.style.zIndex,
        type: 'module'
      };
    }

    // Save all module positions (including title modules)
    document.querySelectorAll('.module').forEach(el => {
      if(el.id && el.id !== 'module-announcements-display') {
        layout[el.id] = {
          left: el.style.left,
          top: el.style.top,
          right: el.style.right,
          width: el.style.width,
          height: el.style.height,
          zIndex: el.style.zIndex,
          type: 'module'
        };
      }
    });

    // Save to Supabase (shared for all users)
    try {
      const { error } = await sb.from('guild_layout').upsert({
        guild_id: 'hated',
        layout_data: JSON.stringify(layout),
        updated_at: new Date().toISOString(),
        updated_by: state.session?.user?.id
      }, { onConflict: 'guild_id' });

      if(error) {
        console.error('Error saving layout:', error);
        showToast(`Failed to save layout: ${error.message || error.code || 'Unknown error'}`, true);
      } else {
        showToast('Layout saved for everyone', false);
      }
    } catch(e) {
      console.error('Error in saveLayout:', e);
      showToast('Error saving layout', true);
    }
  }
}

      if(el && typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

function bindMobileNav(){
  const hamburger = document.getElementById('nav-hamburger-btn');
  if(hamburger) hamburger.addEventListener('click', ()=>{
    state.mobileNavOpen = !state.mobileNavOpen;
    render();
  });
  document.querySelectorAll('[data-close-mobile-nav]').forEach(el=>el.addEventListener('click', ()=>{
    state.mobileNavOpen = false;
    render();
  }));
  // Mobile dropdown toggle
  document.querySelectorAll('.mobile-nav-dropdown-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      const dropdown = btn.closest('.mobile-nav-dropdown');
      if(dropdown) dropdown.classList.toggle('open');
    });
  });
}

function bindDesktopNav(){
  // Desktop dropdown toggle on hover
  document.querySelectorAll('.nav-dropdown').forEach(dropdown=>{
    dropdown.addEventListener('mouseenter', ()=>{
      dropdown.classList.add('open');
    });
    dropdown.addEventListener('mouseleave', ()=>{
      dropdown.classList.remove('open');
    });
  });
}

function updateActiveNavLink(){
  document.querySelectorAll('.nav-link[data-tab]').forEach(link=>{
    if(link.dataset.tab === state.tab){
      link.classList.add('active');
    } else {

  });
}

function rsvpGroupsFor(eventId){
  const groups = { going:[], maybe:[], out:[] };
  state.rsvps.filter(r=>r.event_id===eventId).forEach(r=>{
    if(groups[r.status]) groups[r.status].push(nameFor(r.user_id));
  });
  return groups;
}
function myRsvpFor(eventId){
  const row = state.rsvps.find(r=>r.event_id===eventId && r.user_id===state.session.user.id);
  return row ? row.status : null;
}

function renderCalendar(){
  const officer = testCanManage();
  const y = state.calendarYear, m = state.calendarMonth;
  const first = firstWeekdayOfMonth(y,m);
  const numDays = daysInMonth(y,m);
  const prevMonthDays = daysInMonth(m===0?y-1:y, m===0?11:m-1);
  const cells = [];
  for(let i=0;i<42;i++){
    const offset = i - first;
    let cy=y, cm=m, cd;
    if(offset < 0){ cd = prevMonthDays + offset + 1; cm = m===0?11:m-1; cy = m===0?y-1:y; }
    else if(offset >= numDays){ cd = offset - numDays + 1; cm = m===11?0:m+1; cy = m===11?y+1:y; }
    else { cd = offset + 1; }
    cells.push({ iso: isoFromParts(cy,cm,cd), day: cd, inMonth: offset>=0 && offset<numDays });
  }
  const today = todayISO();
  const eventsByDate = {};
  state.events.forEach(ev=>{ (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev); });

  return `
    <div style="max-width:1200px; margin:0 auto; padding:0 20px;">
    <div class="cal-ornate-frame">
      <div class="ornate-corner tl"></div>
      <div class="ornate-corner tr"></div>
      <div class="ornate-corner bl"></div>
      <div class="ornate-corner br"></div>

      <div class="cal-header">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev">&lsaquo;</button>
          <div class="cal-month-label">${MONTH_NAMES[m]}<span class="cal-month-year"> ${y}</span></div>
          <button class="cal-nav-btn" id="cal-next">&rsaquo;</button>
          <button class="btn secondary" id="cal-today" style="margin-left:6px;">Today</button>
        </div>
        ${ officer ? `<button class="btn" id="cal-add-event">+ Add event</button>` : '' }
      </div>

      <div class="cal-grid">
        ${ WEEKDAY_LABELS.map(w=>`<div class="cal-weekday">${w}</div>`).join('') }
        ${ cells.map(c=>{
          const evs = eventsByDate[c.iso] || [];
          const isPast = c.iso < today;
          const isUpcoming = c.iso >= today && evs.length > 0;
          return `
          <div class="cal-cell ${c.inMonth?'':'other-month'} ${c.iso===today?'today':''} ${isPast?'past':''} ${isUpcoming?'upcoming':''}">
            <div class="cal-daynum">${c.day}</div>
            <div class="cal-events">
              ${ evs.map(ev=>`
                <button class="cal-event-pill ${isPast?'past-event':''}" data-open-event="${ev.id}">
                  <span class="cal-event-title">${esc(ev.title)}</span>
                </button>
              `).join('') }
            </div>
            ${ !c.inMonth ? '' : (evs.length === 0 ? `<div class="cal-empty-indicator"></div>` : '') }
            ${ officer ? `<button class="cal-add-btn" data-adddate="${c.iso}" title="Add event">+</button>` : '' }
          </div>`;
        }).join('') }
      </div>

      <!-- Absence Summary Section -->
      ${ (() => {
        const absences = {};
        state.events.filter(ev => ev.date >= today).forEach(ev => {
          const outs = state.rsvps.filter(r => r.event_id === ev.id && r.status === 'out');
          outs.forEach(rsvp => {
            const memberId = rsvp.user_id;
            const memberName = nameFor(memberId);
            if(!absences[memberId]) {
              absences[memberId] = { name: memberName, dates: [], events: [] };
            }
            if(!absences[memberId].dates.includes(ev.date)) {
              absences[memberId].dates.push(ev.date);
            }
            absences[memberId].events.push(ev);
          });
        });

        const absenceList = Object.values(absences);
        const html = absenceList.length === 0
          ? '<div class="cal-absence-empty">✓ Everyone available for upcoming events</div>'
          : absenceList.map(absence => {
              const dateRange = absence.dates.length === 1
                ? fmtDate(absence.dates[0])
                : `${fmtDate(absence.dates[0])} – ${fmtDate(absence.dates[absence.dates.length - 1])}`;
              return `
                <div class="cal-absence-item">
                  <div class="cal-absence-member">
                    <div class="cal-absence-icon">✗</div>
                    <div>
                      <div class="cal-absence-name">${esc(absence.name)}</div>
                      <div class="cal-absence-dates">Out: ${dateRange}</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('');

        return `
          <div class="cal-absence-summary">
            <div class="cal-absence-title">Guild Absence Summary</div>
            <div class="cal-absence-list">
              ${html}
            </div>
          </div>
        `;
      })() }
    </div>
    </div>
  `;
}

    return `
      ${renderStratBreadcrumb(raid, boss)}

          <div class="list-item tree-row" data-open-boss="${b.id}">
            <div style="flex:1; font-weight:600;">${esc(b.name)}</div>

        `).join('') : emptyState('No bosses added yet.') }

  return `

    ${ officer ? `

      <h3 style="margin-bottom:14px;">Add a raid instance</h3>

    </div>` : '' }

    <div class="panel style-glass">
      ${ state.raids.length ? state.raids.map(r=>{
        const count = state.bosses.filter(b=>b.raid_id===r.id).length;
        return `

          <div style="flex:1;">
            <div style="font-weight:600;">${esc(r.name)}</div>

            <div style="font-weight:600;">${esc(r.label)}</div>

/* ---------------- roster tab: members + raid composition ---------------- */
function renderRoster(){
  const officer = testCanManage();
  const isRaidLeader = testIsRaidLeader();
  const sel = state.selectedSpec;
  const allProfiles = Object.values(state.profilesById).sort((a,b)=> (a.character_name||a.discord_username||'').localeCompare(b.character_name||b.discord_username||''));

  function slotAt(g,s){ return state.compSlots.find(row=>row.group_index===g && row.slot_index===s) || null; }

  return `
    ${pageHeader('Roster', 'Members', "Who's in the guild, and the current raid composition.")}

    <div class="panel style-glass">
      <h3 style="margin-bottom:4px;">Raid Composition</h3>
      <p class="muted sans" style="margin-bottom:16px;">
        ${ (officer || isRaidLeader)
          ? "Pick a class and spec below, then click a slot to assign a raider's name to it. Click a filled slot to reassign it, or use the  to clear it."
          : "This is the current raid composition. Officers manage who's assigned to each spot." }
      </p>

      ${ (officer || isRaidLeader) ? `
      <div class="comp-palette">
        ${ Object.entries(CLASS_SPECS).map(([classKey,cls])=>`
          <div class="class-block" style="border-color:${cls.color}55;">
            ${ cls.specs.map(s=>`
              <button type="button" class="spec-btn ${sel && sel.classKey===classKey && sel.specKey===s.key ? 'selected':''}"
                data-class="${classKey}" data-spec="${s.key}"
                style="${specIconStyle(classKey)}" title="${esc(cls.label)}  ${esc(s.label)}">${specIconHtml(classKey, s.key)}</button>
            `).join('') }
          </div>
        `).join('') }
      </div>` : '' }

      <div class="comp-groups">
        ${ [0,1,2,3].map(gi=>`
          <div class="comp-group">
            <div class="comp-group-title">Group ${gi+1}</div>
            ${ [0,1,2,3,4].map(si=>{
              const slot = slotAt(gi,si);
              const specLabel = slot ? CLASS_SPECS[slot.class_key].specs.find(s=>s.key===slot.spec_key).label : '';
              const isRaidLeader = testIsRaidLeader();
              const canEditSlot = officer || isRaidLeader;
              const clickAttr = canEditSlot ? `data-slot-click="${gi}|${si}"` : '';
              let slotClasses = `${slot?'filled':''} ${canEditSlot?'editable':''}`;
              if(slot) {
                const profiles = Object.values(state.profilesById || {});
                const userId = profiles.find(p => p.character_name === slot.character_name)?.id;
                const customization = getUserNameCustomization(userId);
                if(customization.border) slotClasses += ` ${customization.border}`;
                if(customization.nameCustom) slotClasses += ` ${customization.nameCustom}`;
              }
              return `
              <div class="comp-slot ${slotClasses}" ${clickAttr} style="${slot?`border-left:3px solid ${CLASS_SPECS[slot.class_key].color};`:''}">
                ${ slot ? `
                  <span class="spec-icon-sm" style="${specIconStyle(slot.class_key)}">${specIconHtml(slot.class_key, slot.spec_key)}</span>
                  <span class="comp-slot-info">
                    <span class="comp-slot-name">${esc(slot.character_name)}</span>
                    <span class="comp-slot-spec" style="color:${CLASS_SPECS[slot.class_key].color};">${esc(specLabel)}</span>
                  </span>
                  ${ (officer || isRaidLeader) ? `<button type="button" class="comp-slot-remove" data-remove="${gi}|${si}" title="Remove">&times;</button>` : '' }
                ` : `<span class="comp-slot-empty muted">Empty</span>` }
                <span class="comp-slot-extras">
                  ${ [1,2].map(n=>{
                    const extraKey = `comp_extra:${gi}:${si}:${n}`;
                    const url = state.siteImages[extraKey];
                    const canEdit = officer || isRaidLeader;
                    return `<button type="button" class="comp-extra-icon ${url?'filled':''} ${canEdit?'':'readonly'}" ${canEdit?`data-choose-slot="${extraKey}"`:''} title="${canEdit?'Click to set an icon':''}">
                      ${ url ? `<img src="${esc(url)}" alt="">` : '' }
                    </button>`;
                  }).join('') }
                </span>
              </div>`;
            }).join('') }
          </div>
        `).join('') }
      </div>
    </div>

    <div class="panel style-glass">
      <h3 style="margin-bottom:14px;">Guild Members</h3>
      <p class="muted sans" style="margin-bottom:14px;">Officer/Member status is synced from your Discord roles automatically each time you sign in.</p>
      <div class="field" style="max-width:320px; margin-bottom:14px;">
        <label>Your character name</label>
        <div style="display:flex; gap:8px;">
          <input id="my-name-input" value="${esc(myName())}">
          <button class="btn secondary" type="button" id="my-name-save-btn">Save</button>
        </div>
      </div>
      <button class="btn secondary" type="button" id="sync-discord-role-btn" style="margin-bottom:14px;">Re-check my Discord roles now</button>
      <div class="rule"></div>
      ${ allProfiles.length ? allProfiles.map(p=>`
        <div class="list-item">
          <div style="flex:1;">
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="font-weight:600;">${esc(p.character_name||p.discord_username||'Member')}</div>
              ${ isRaidLeader ? '<button class="btn secondary" data-rename-member="' + p.id + '" style="font-size:11px; padding:4px 8px;">Rename</button>' : '' }
            </div>
            <div class="muted sans" style="font-size:12px; margin-top:2px;">Gold: ${(p.gold||0).toLocaleString()} current | Earned: ${(p.gold_earned_total||0).toLocaleString()}</div>

/* ---- update trophy case display ---- */
function updateTrophyCaseDisplay(){
  const trophy1 = document.getElementById('trophy-1st');
  const trophy2 = document.getElementById('trophy-2nd');
  const trophy3 = document.getElementById('trophy-3rd');
  const gold1 = document.getElementById('trophy-1st-gold');
  const gold2 = document.getElementById('trophy-2nd-gold');
  const gold3 = document.getElementById('trophy-3rd-gold');

  if(trophy1 && state.goldLeaderboard && state.goldLeaderboard[0]) {
    trophy1.textContent = state.goldLeaderboard[0].character_name || state.goldLeaderboard[0].discord_username;
    if(gold1) gold1.textContent = ' ' + (state.goldLeaderboard[0].gold_earned_total || 0).toLocaleString() + 'g';
  }
  if(trophy2 && state.goldLeaderboard && state.goldLeaderboard[1]) {
    trophy2.textContent = state.goldLeaderboard[1].character_name || state.goldLeaderboard[1].discord_username;
    if(gold2) gold2.textContent = ' ' + (state.goldLeaderboard[1].gold_earned_total || 0).toLocaleString() + 'g';
  }
  if(trophy3 && state.goldLeaderboard && state.goldLeaderboard[2]) {
    trophy3.textContent = state.goldLeaderboard[2].character_name || state.goldLeaderboard[2].discord_username;
    if(gold3) gold3.textContent = ' ' + (state.goldLeaderboard[2].gold_earned_total || 0).toLocaleString() + 'g';
  }
}

async function loadGoldLeaderboard(){
  try {
    const { data, error } = await sb.rpc('get_gold_leaderboard', { p_limit: 4 });
    if(error) console.error('RPC error:', error);
    if(!error && data) {
      state.goldLeaderboard = data;
      updateTrophyCaseDisplay();
    }
  } catch(e){ console.error('Leaderboard fetch failed:', e); }
}

/* ---- render roster groups (for home page) ---- */
function renderRosterGroups(){
  const officer = testCanManage();
  const isRaidLeader = testIsRaidLeader();
  const canEdit = officer || isRaidLeader;

  function slotAt(g,s){ return state.compSlots.find(row=>row.group_index===g && row.slot_index===s) || null; }

  return `
    <div class="comp-groups">
      ${ [0,1,2,3].map(gi=>`
        <div class="comp-group">
          <div class="comp-group-title">Group ${gi+1}</div>
          ${ [0,1,2,3,4].map(si=>{
            const slot = slotAt(gi,si);
            const specLabel = slot ? CLASS_SPECS[slot.class_key].specs.find(s=>s.key===slot.spec_key).label : '';
            const clickAttr = canEdit ? `data-slot-click="${gi}|${si}"` : '';
            let slotClasses = `${slot?'filled':''} ${canEdit?'editable':''}`;
            if(slot) {
              const profiles = Object.values(state.profilesById || {});
              const userId = profiles.find(p => p.character_name === slot.character_name)?.id;
              const customization = getUserNameCustomization(userId);
              if(customization.border) slotClasses += ` ${customization.border}`;
              if(customization.nameCustom) slotClasses += ` ${customization.nameCustom}`;
            }
            return `
            <div class="comp-slot ${slotClasses}" ${clickAttr} style="${slot?`border-left:3px solid ${CLASS_SPECS[slot.class_key].color};`:''}">
              ${ slot ? `
                <span class="spec-icon-sm" style="${specIconStyle(slot.class_key)}">${specIconHtml(slot.class_key, slot.spec_key)}</span>
                <span class="comp-slot-info">
                  <span class="comp-slot-name">${esc(slot.character_name)}</span>
                  <span class="comp-slot-spec" style="color:${CLASS_SPECS[slot.class_key].color};">${esc(specLabel)}</span>
                </span>
                ${ canEdit ? `<button type="button" class="comp-slot-remove" data-remove="${gi}|${si}" title="Remove">&times;</button>` : '' }
              ` : `<span class="comp-slot-empty muted">Empty</span>` }
            </div>`;
          }).join('') }
        </div>
      `).join('') }
    </div>
  `;
}

/* ---- gold leaderboard widget ---- */
function renderGoldLeaderboard(){
  const profiles = Object.values(state.profilesById || {});
  const withGold = profiles.filter(p => (p.gold_earned_total || 0) > 0).sort((a, b) => (b.gold_earned_total || 0) - (a.gold_earned_total || 0));

  if(withGold.length === 0) return '<div class="gold-leaderboard-widget"><div class="gold-leaderboard-widget-title">Gold Leaderboard</div><p style="text-align:center; color:var(--text-muted); font-size:12px;">No earners yet</p></div>';

  const entries = withGold.map((profile, idx) => {
    const rank = idx + 1;
    const customization = getUserNameCustomization(profile.id);
    const slotClasses = [
      customization.border,
      customization.nameCustom
    ].filter(Boolean).join(' ');

    let bgGradient = '';
    let boxShadow = '';
    let rankSparkle = '';
    let isTopRank = false;

    if(rank === 1) {
      bgGradient = 'linear-gradient(90deg, rgba(255,215,0,0.3) 0%, rgba(255,215,0,0.2) 25%, rgba(240,223,180,0.7) 50%, rgba(255,215,0,0.2) 75%, rgba(255,215,0,0.3) 100%)';
      boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 8px rgba(255,215,0,0.2)';
      rankSparkle = '#1';
      isTopRank = true;
    } else if(rank === 2) {
      bgGradient = 'linear-gradient(90deg, rgba(192,192,192,0.3) 0%, rgba(192,192,192,0.2) 25%, rgba(240,240,240,0.7) 50%, rgba(192,192,192,0.2) 75%, rgba(192,192,192,0.3) 100%)';
      boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 8px rgba(192,192,192,0.2)';
      rankSparkle = '#2';
      isTopRank = true;
    } else if(rank === 3) {
      bgGradient = 'linear-gradient(90deg, rgba(205,127,50,0.3) 0%, rgba(205,127,50,0.2) 25%, rgba(230,170,80,0.7) 50%, rgba(205,127,50,0.2) 75%, rgba(205,127,50,0.3) 100%)';
      boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 8px rgba(205,127,50,0.2)';
      rankSparkle = '#3';
      isTopRank = true;
    }

    let animationDelay = '';
    if(rank === 1) animationDelay = '0s';
    else if(rank === 2) animationDelay = '1.5s';
    else if(rank === 3) animationDelay = '3s';

    const entryClass = isTopRank ? 'rank-top-3' : '';
    const cssVars = isTopRank ? `--entry-glow-1:${boxShadow};` : '';
    const bgStyle = isTopRank ? `background:${bgGradient}; background-size:200% 100%;` : `background-color:rgba(0,0,0,0.3);`;
    const animDelay = isTopRank ? `animation-delay:${animationDelay};` : '';

    return `
      <div class="leaderboard-entry ${entryClass}" style="align-items:flex-start; gap:4px; ${bgStyle} padding:8px; border-radius:4px; box-shadow:${boxShadow}; ${cssVars} ${animDelay}">
        <div class="leaderboard-rank" style="flex-shrink:0;">${rankSparkle || '#' + rank}</div>
        <div style="flex:1; min-width:0;">
          <div class="comp-slot ${slotClasses}" style="height:24px; display:flex; align-items:center; justify-content:center; padding:0 4px; font-size:10px; font-weight:600; overflow:hidden; text-overflow:ellipsis; position:relative;">
            <span style="position:relative; z-index:100;">${esc(profile.character_name)}</span>
          </div>
          <div style="font-size:10px; color:#ffd700; font-weight:700; margin-top:2px; text-align:center;">💰 ${(profile.gold_earned_total || 0).toLocaleString()}g</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="gold-leaderboard-widget">
      <div class="gold-leaderboard-widget-title">💰 Gold Leaderboard</div>
      <div class="gold-leaderboard-entries">
        ${entries}
      </div>
    </div>
  `;
}

function renderAdmin(){
  if(!state.profile || !state.profile.protected){
    state.tab = 'news';
    return renderNews();
  }

  if(state.adminPurchases === undefined || state.adminPurchases === null){
    loadAdminPurchases();
    return `
      ${pageHeader('Admin', 'Raid Leader Only', "Visible only to the protected Raid Leader account  not even other officers can see this tab.")}
      <div class="panel style-glass">
        <p style="color:var(--text-muted);">Loading admin data...</p>
      </div>
    `;
  }

  if(state.cheatData === undefined){
    loadCheatData();
    return `
      ${pageHeader('Admin', 'Raid Leader Only', "Visible only to the protected Raid Leader account  not even other officers can see this tab.")}
      <div class="panel style-glass">
        <p style="color:var(--text-muted);">Loading cheat detection data...</p>
      </div>
    `;
  }

  const purchases = state.adminPurchases;
  let html = `
    ${pageHeader('Admin', 'Raid Leader Only', "Visible only to the protected Raid Leader account  not even other officers can see this tab.")}
    <div class="panel style-glass">
      <h2>Cheater Dashboard</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Monitor anti-cheat system for suspicious activity and soft-bans.</p>
  `;

  // Cheat data
  const cheatData = state.cheatData || {};
  const suspects = cheatData.suspects || [];
  const auditLog = cheatData.auditLog || [];
  const flaggedGames = cheatData.flaggedGames || [];

  // Suspects section
  html += `<div style="margin-bottom:24px;">
    <h3 style="font-size:14px; color:#d4a574; margin-bottom:12px;">🚨 Users Under Review / Soft-Banned (${suspects.length})</h3>`;

  if(suspects.length === 0){
    html += `<p style="color:var(--text-muted); font-size:13px;">No suspicious activity detected.</p>`;
  } else {
    html += `<div style="display:flex; flex-direction:column; gap:8px;">`;
    suspects.forEach(s=>{
      const statusColor = s.status === 'SOFT_BAN' ? '#b05253' : '#d4a574';
      const statusLabel = s.status === 'SOFT_BAN' ? '🔒 SOFT-BAN' : '⚠️ UNDER REVIEW';
      html += `
        <div style="padding:12px; background:var(--bg-input); border-radius:4px; border-left:3px solid ${statusColor};">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="color:var(--text-normal); font-weight:600;">${s.discord_username}</span>
            <span style="color:${statusColor}; font-weight:700; font-size:12px;">${statusLabel}</span>
          </div>
          <div style="color:var(--text-muted); font-size:12px;">
            💥 ${s.total_points} points • 🎮 ${s.games_played_7d} games (${s.win_pct_7d}% wins) • 📊 ${s.flag_count} flags
          </div>
          <div style="color:var(--text-muted); font-size:11px;">Last flagged: ${new Date(s.last_flagged_at).toLocaleString()}</div>
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // Recent suspicious activity
  html += `<div style="margin-bottom:24px;">
    <h3 style="font-size:14px; color:#d4a574; margin-bottom:12px;">🔍 Recent Suspicious Activity (Last 20)</h3>`;

  if(auditLog.length === 0){
    html += `<p style="color:var(--text-muted); font-size:13px;">No activity logged.</p>`;
  } else {
    html += `<div style="display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto;">`;
    auditLog.slice(0, 20).forEach(log=>{
      const severityColor = log.severity === 'HIGH' ? '#b05253' : (log.severity === 'MEDIUM' ? '#d4a574' : '#7fa363');
      const user = Object.values(state.profilesById || {}).find(p=>p.id===log.user_id);
      const userName = user?.discord_username || 'Unknown';
      html += `
        <div style="padding:10px; background:rgba(0,0,0,0.2); border-radius:3px; border-left:2px solid ${severityColor}; font-size:12px;">
          <div style="color:var(--text-normal); margin-bottom:2px;">
            <strong>${userName}</strong> - ${log.event_type}
          </div>
          <div style="color:var(--text-muted); font-size:11px;">
            🏷️ ${log.flags.join(', ')} • ${new Date(log.created_at).toLocaleString()}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // Flagged games
  html += `<div style="margin-bottom:24px;">
    <h3 style="font-size:14px; color:#d4a574; margin-bottom:12px;">🎮 Flagged Games (Last 20)</h3>`;

  if(flaggedGames.length === 0){
    html += `<p style="color:var(--text-muted); font-size:13px;">No games flagged.</p>`;
  } else {
    html += `<div style="display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto;">`;
    flaggedGames.slice(0, 20).forEach(g=>{
      const user = Object.values(state.profilesById || {}).find(p=>p.id===g.user_id);
      const userName = user?.discord_username || 'Unknown';
      const result = g.won ? '✅ WON' : '❌ LOST';
      html += `
        <div style="padding:10px; background:rgba(0,0,0,0.2); border-radius:3px; border-left:2px solid #7fa363; font-size:12px;">
          <div style="color:var(--text-normal); margin-bottom:2px;">
            <strong>${userName}</strong> - ${g.game_type} ${result}
          </div>
          <div style="color:var(--text-muted); font-size:11px;">
            🏷️ ${g.flags.join(', ')} • 💰 ${g.gold_awarded}g • ${new Date(g.created_at).toLocaleString()}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`;

  html += `</div>`;

  // Shop Refunds section
  html += `
    <div class="panel style-glass">
      <h2>Shop Refunds</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Manage and refund shop purchases in case of accidents or disputes.</p>

  if(purchases.length === 0){
    html += `<p style="color:var(--text-muted);">No shop purchases yet.</p>`;
  } else {
    const grouped = {};
    purchases.forEach(p=>{
      if(!grouped[p.user_id]) grouped[p.user_id] = [];
      grouped[p.user_id].push(p);
    });

    Object.entries(grouped).forEach(([userId, userPurchases])=>{
      const profile = Object.values(state.profilesById || {}).find(pr=>pr.id===userId);
      const userName = profile?.character_name || 'Unknown User';

          <div style="display:flex; flex-direction:column; gap:8px;">
      `;
      userPurchases.forEach(p=>{
        const date = new Date(p.purchased_at).toLocaleDateString();
        const currentItem = state.shopItems?.find(i => i.id === p.item_id);
        const displayName = currentItem?.name || p.item_name;
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--bg-input); border-radius:4px;">

  const stickerPriceBtn = document.getElementById('save-sticker-price-btn');
  if(stickerPriceBtn) stickerPriceBtn.addEventListener('click', saveStickerPrice);
  document.querySelectorAll('[data-edit-shop-item]').forEach(b=>b.addEventListener('click', ()=>startEditShopItem(b.dataset.editShopItem)));
  document.querySelectorAll('[data-save-shop-item]').forEach(b=>b.addEventListener('click', ()=>saveShopItem(b.dataset.saveShopItem)));
  document.querySelectorAll('[data-cancel-shop-edit]').forEach(b=>b.addEventListener('click', cancelEditShopItem));

  // Debug panel buttons
  const testRoleActual = document.getElementById('test-role-actual');
  const testRoleMember = document.getElementById('test-role-member');
  const testRoleOfficer = document.getElementById('test-role-officer');
  const testRoleRaidleader = document.getElementById('test-role-raidleader');

  if(testRoleActual) testRoleActual.addEventListener('click', ()=>{ setTestRole(null); render(); });
  if(testRoleMember) testRoleMember.addEventListener('click', ()=>{ setTestRole('member'); render(); });
  if(testRoleOfficer) testRoleOfficer.addEventListener('click', ()=>{ setTestRole('officer'); render(); });
  if(testRoleRaidleader) testRoleRaidleader.addEventListener('click', ()=>{ setTestRole('raidleader'); render(); });

  // Gold audit log
  if(document.getElementById('audit-log-container')){
    (async ()=>{
      const transactions = await loadGoldTransactions();
      state.goldTransactions = transactions;
      updateAuditLog();

      const playerFilter = document.getElementById('audit-player-filter');
      const typeFilter = document.getElementById('audit-type-filter');
      if(playerFilter) playerFilter.addEventListener('input', updateAuditLog);
      if(typeFilter) typeFilter.addEventListener('change', updateAuditLog);
    })();
  }

  function updateAuditLog(){
    const container = document.getElementById('audit-log-container');
    if(!container) return;
    const playerFilter = document.getElementById('audit-player-filter')?.value || '';
    const typeFilter = document.getElementById('audit-type-filter')?.value || '';
    container.innerHTML = renderAuditLog(state.goldTransactions || [], playerFilter, typeFilter);

    // Add toggle handlers
    document.querySelectorAll('.audit-player-toggle').forEach(btn => {
      btn.addEventListener('click', ()=>{
        const player = btn.dataset.player;
        const content = document.querySelector(`.audit-player-content[data-player="${player}"]`);
        const icon = btn.querySelector('.audit-toggle-icon');
        if(content.style.display === 'none'){
          content.style.display = 'block';
          icon.style.transform = 'rotate(90deg)';
        } else {
          content.style.display = 'none';
          icon.style.transform = 'rotate(0deg)';
        }
      });
    });
  }
}

boot();

})();
</script>
</body>
</html>
