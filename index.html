<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Hall</title>
<style>
  :root{
    --bg-primary:#3a2e1d;
    --bg-secondary:#2f2515;
    --bg-tertiary:#241b10;
    --bg-card:#493a24;
    --bg-input:#261c11;
    --bg-hover:rgba(207,154,68,0.08);
    --bg-selected:rgba(207,154,68,0.14);
    --divider:rgba(207,154,68,0.14);
    --divider-strong:rgba(207,154,68,0.28);
    --text-normal:#ece0c8;
    --text-muted:#a4926c;
    --text-faint:#6b5e46;
    --blurple:#a97832;
    --blurple-hover:#c4934a;
    --green:#7fa363;
    --green-bg:rgba(127,163,99,0.14);
    --yellow:#cf9a44;
    --yellow-bg:rgba(207,154,68,0.14);
    --red:#b0524f;
    --red-bg:rgba(176,82,79,0.14);
    --gray-role:#6b5e46;
    --shadow-card: 0 1px 0 rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, #2f2619 0px, #4a3c29 90px, var(--bg-primary) 420px, var(--bg-primary) 100%) var(--bg-primary);
    color:var(--text-normal);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  h1,h2,h3,h4{ font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; font-weight:700; margin:0; color:var(--text-normal); letter-spacing:0.01em; }
  a{ color:#dcb570; text-decoration:none; }
  a:hover{ text-decoration:underline; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }

  #app{ min-height:100vh; }

  .sidebar{
    width:232px; flex-shrink:0;
    background:var(--bg-secondary);
    color:var(--text-normal);
    display:flex; flex-direction:column;
    padding:18px 0;
    border-right:1px solid var(--divider-strong);
  }
  .sidebar .crest{
    padding:0 16px 16px 16px;
    border-bottom:1px solid var(--divider-strong);
    margin-bottom:10px;
  }
  .sidebar .crest h1{ color:var(--text-normal); font-size:17px; line-height:1.3; font-weight:700; }
  .sidebar .crest .tag{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
  .nav-item{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    margin:0;
    font-size:14px; font-weight:500;
    color:var(--text-muted);
    cursor:pointer;
    border-radius:0;
    background:none; border:none; border-left:2px solid transparent;
    width:100%; text-align:left;
    font-family: inherit;
    letter-spacing:0.01em;
  }
  .nav-item:hover{ background:var(--bg-hover); color:var(--text-normal); border-left-color:var(--divider-strong); }
  .nav-item.active{ background:var(--bg-selected); color:#f0dfb4; border-left-color:var(--blurple-hover); }
  .nav-item .hash{ opacity:0.5; font-weight:600; color:var(--blurple); }
  .nav-item.active .hash{ opacity:0.9; }
  .sidebar-foot{
    margin-top:auto; padding:12px 16px 0 16px; border-top:1px solid var(--divider-strong);
    font-size:12px; color:var(--text-muted);
  }
  .sidebar-foot .who{ color:var(--text-normal); font-weight:600; }
  .logout-link{ color:#dcb570; cursor:pointer; text-decoration:none; background:none; border:none; padding:0; font-size:12px; font-family:inherit; }
  .logout-link:hover{ text-decoration:underline; }

  .main{ max-width:1100px; margin:0 auto; padding:110px 40px 32px 40px; }
  .eyebrow{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--blurple); margin-bottom:8px; }
  .page-title{ font-size:26px; margin-bottom:6px; font-weight:700; }
  .page-sub{ font-size:14px; color:var(--text-muted); margin-bottom:24px; line-height:1.5; }

  .panel{
    background:var(--bg-card);
    border:1px solid var(--divider);
    border-top:2px solid var(--divider-strong);
    border-radius:2px;
    padding:20px 22px;
    margin-bottom:16px;
    box-shadow: var(--shadow-card);
  }
  .panel + .panel{ margin-top:16px; }
  .rule{ border:none; border-top:1px solid var(--divider); margin:16px 0; }

  .btn{
    font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    padding:9px 18px; border-radius:2px;
    border:1px solid rgba(255,224,153,0.35);
    background:linear-gradient(180deg, #cf9a44 0%, #9c6a28 100%);
    color:#1b130a;
  }
  .btn:hover{ background:linear-gradient(180deg, #e0b264 0%, #b17c34 100%); }
  .btn.secondary{ background:var(--bg-hover); color:var(--text-normal); border:1px solid var(--divider-strong); text-transform:none; font-weight:500; letter-spacing:0; }
  .btn.secondary:hover{ background:rgba(207,154,68,0.16); }
  .btn.danger{ background:transparent; color:var(--red); border:1px solid rgba(176,82,79,0.4); text-transform:none; font-weight:500; letter-spacing:0; }
  .btn.danger:hover{ background:var(--red); color:#fff; border-color:var(--red); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--text-muted); margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; font-size:14px;
    border:1px solid var(--divider-strong); border-radius:2px; background:var(--bg-input); color:var(--text-normal);
    outline:none;
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--text-faint); }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--blurple); }
  .field textarea{ min-height:90px; resize:vertical; }
  .field-error{ color:var(--red); font-size:13px; margin-top:2px; margin-bottom:10px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:160px; }

  .badge{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:2px;
    letter-spacing:0.02em; border:1px solid transparent;
  }
  .badge.going{ background:var(--green-bg); color:var(--green); border-color:rgba(127,163,99,0.35); }
  .badge.maybe{ background:var(--yellow-bg); color:var(--yellow); border-color:rgba(207,154,68,0.35); }
  .badge.out{ background:var(--red-bg); color:var(--red); border-color:rgba(176,82,79,0.35); }
  .badge.role-officer{ background:rgba(207,154,68,0.16); color:#e0c07f; border-color:rgba(207,154,68,0.35); }
  .badge.role-member{ background:rgba(255,255,255,0.05); color:var(--text-muted); border-color:var(--divider-strong); }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--divider); }
  td{ padding:10px; border-bottom:1px solid var(--divider); vertical-align:top; color:var(--text-normal); }
  tr:last-child td{ border-bottom:none; }

  .empty{ text-align:center; padding:36px 20px; color:var(--text-muted); font-size:14px; }

  .landing{ min-height:100vh; width:100%; display:flex; align-items:flex-start; justify-content:center; padding:56px 24px; background:var(--bg-primary); }
  .landing-wrap{ max-width:920px; width:100%; }
  .landing-hero{ text-align:center; margin-bottom:32px; }
  .landing-hero h1{ font-size:32px; margin-bottom:10px; font-weight:700; }
  .landing-hero p{ font-size:15px; color:var(--text-muted); max-width:520px; margin:0 auto; line-height:1.5; }
  .landing-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:760px){ .landing-grid{ grid-template-columns:1fr; } .sidebar{ display:none; } .main{ padding:24px; } }

  .tab-strip{ display:flex; gap:4px; margin-bottom:22px; border-bottom:1px solid var(--divider); }
  .tab-btn{
    background:none; border:none; padding:10px 14px; font-size:13px; font-weight:600;
    color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab-btn.active{ color:#fff; border-bottom-color:var(--blurple); }

  .list-item{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--divider); }
  .list-item:last-child{ border-bottom:none; }
  .muted{ color:var(--text-muted); font-size:13px; }

  .rsvp-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .rsvp-btn{
    font-size:12px; font-weight:600; padding:6px 11px; border-radius:2px; border:1px solid var(--divider-strong); background:var(--bg-input); color:var(--text-muted);
  }
  .rsvp-btn.sel-going{ background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .rsvp-btn.sel-maybe{ background:var(--yellow-bg); border-color:var(--yellow); color:var(--yellow); }
  .rsvp-btn.sel-out{ background:var(--red-bg); border-color:var(--red); color:var(--red); }

  .toast{
    position:absolute; top:18px; right:18px; background:#100d09; color:var(--text-normal);
    padding:10px 16px; border-radius:2px; font-size:13px;
    box-shadow:0 8px 20px rgba(0,0,0,0.5); z-index:50; border:1px solid var(--divider-strong);
  }
  .icon{ font-family: inherit; }
  .link-row a{ word-break:break-all; }

  /* ---- calendar ---- */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav-btn{ background:var(--bg-hover); border:1px solid var(--divider-strong); color:var(--text-normal); width:30px; height:30px; border-radius:2px; font-size:16px; line-height:1; }
  .cal-nav-btn:hover{ background:rgba(207,154,68,0.16); }
  .cal-month-label{ font-size:18px; font-weight:700; font-family: Georgia, "Iowan Old Style", serif; min-width:150px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
  .cal-weekday{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); text-align:center; padding-bottom:4px; }
  .cal-cell{ background:var(--bg-card); border:1px solid var(--divider); border-radius:2px; min-height:90px; padding:6px; position:relative; display:flex; flex-direction:column; gap:4px; }
  .cal-cell.other-month{ opacity:0.35; }
  .cal-cell.today{ border-color:var(--blurple); box-shadow: 0 0 0 1px var(--blurple) inset; }
  .cal-daynum{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .cal-cell.today .cal-daynum{ color:#f0dfb4; }
  .cal-events{ display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .cal-event-pill{ background:var(--bg-selected); color:#e0c07f; border:1px solid rgba(207,154,68,0.25); border-radius:2px; padding:3px 6px; font-size:11px; text-align:left; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
  .cal-event-pill:hover{ background:rgba(207,154,68,0.28); }
  .cal-add-btn{ position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:2px; background:var(--bg-hover); border:none; color:var(--text-muted); font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .1s; }
  .cal-cell:hover .cal-add-btn{ opacity:1; }
  .cal-add-btn:hover{ background:var(--blurple); color:#1b130a; }
  @media (max-width:760px){
    .cal-cell{ min-height:60px; }
    .cal-event-pill{ font-size:10px; }
  }

  /* ---- modal ---- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-panel{ background:var(--bg-card); border-radius:2px; border-top:2px solid var(--divider-strong); max-width:480px; width:100%; max-height:85vh; overflow-y:auto; padding:24px; box-shadow:0 16px 48px rgba(0,0,0,0.6); border-left:1px solid var(--divider); border-right:1px solid var(--divider); border-bottom:1px solid var(--divider); }
  .modal-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:12px; }
  .modal-header h3{ font-size:19px; font-family: Georgia, "Iowan Old Style", serif; }
  .modal-x{ background:none; border:none; color:var(--text-muted); font-size:22px; line-height:1; padding:2px 8px; border-radius:2px; flex-shrink:0; }
  .modal-x:hover{ background:var(--bg-hover); color:#fff; }

  /* ---- epic hero (setup / login) ---- */
  .wow-hero{
    position:relative;
    min-height:100vh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:90px 24px 0 24px;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(207,154,68,0.16), transparent 65%),
      linear-gradient(180deg, #0b0d16 0%, #14172a 45%, #1b1e30 100%);
    overflow:hidden;
  }
  .starfield{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 10% 20%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 50% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 40%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 30% 85%, #fff, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 45% 40%, #fff, transparent),
      radial-gradient(1px 1px at 5% 90%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 95% 10%, #fff, transparent);
    background-repeat:repeat; background-size:340px 340px;
    opacity:0.4; pointer-events:none;
  }
  .hero-glow{
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:700px; height:500px;
    background:radial-gradient(ellipse at center, rgba(207,154,68,0.22), transparent 70%);
    filter:blur(10px); pointer-events:none;
  }
  .hero-content{ position:relative; z-index:2; max-width:920px; width:100%; display:flex; flex-direction:column; align-items:center; padding-bottom:60px; }
  .crest-svg{ filter:drop-shadow(0 4px 16px rgba(0,0,0,0.5)); }
  .gold-text{
    background:linear-gradient(180deg, #f5d78e 0%, #cf9a44 45%, #8a5a20 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-title{
    font-size:44px; font-weight:800; text-align:center; letter-spacing:0.01em;
    margin-bottom:14px; line-height:1.15;
    filter:drop-shadow(0 0 22px rgba(207,154,68,0.28));
  }
  .hero-sub{ font-size:15px; color:var(--text-muted); text-align:center; max-width:540px; margin:0 auto 32px auto; line-height:1.6; }
  .hero-panel{ width:100%; background:rgba(20,22,36,0.72); backdrop-filter:blur(6px); border:1px solid rgba(207,154,68,0.18); }
  .landing-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; width:100%; }
  @media (max-width:760px){ .landing-grid{ grid-template-columns:1fr; } .hero-title{ font-size:32px; } }
  .btn-epic{
    display:block; width:100%; margin-top:6px;
    background:linear-gradient(180deg, #d8b26a 0%, #a97832 55%, #8a5a20 100%);
    color:#1b130a; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.08em;
    padding:13px 20px; border-radius:4px; border:1px solid rgba(255,224,153,0.55);
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .btn-epic:hover{ background:linear-gradient(180deg, #e6c47e 0%, #b98a40 55%, #9c6a28 100%); }
  .aurora{
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(80,200,170,0.10), rgba(140,90,220,0.09) 40%, rgba(207,154,68,0.10) 70%);
    mix-blend-mode:screen;
    animation:auroraShift 16s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes auroraShift{
    0%,100%{ opacity:0.5; transform:translateX(-2%); }
    50%{ opacity:0.85; transform:translateX(2%); }
  }
  .hero-mountains-far{
    position:absolute; left:0; right:0; bottom:70px; width:100%; height:220px;
    z-index:1; pointer-events:none;
  }
  .hero-mountains-near{
    position:absolute; left:0; right:0; bottom:0; width:100%; height:150px;
    z-index:1; pointer-events:none;
  }
  .embers{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .ember{
    position:absolute; bottom:60px; border-radius:50%;
    background:radial-gradient(circle, #ffe1a3, #cf9a44 55%, transparent 75%);
    box-shadow:0 0 6px 1px rgba(230,180,100,0.55);
    animation-name:emberFloat; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes emberFloat{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.9; }
    85%{ opacity:0.5; }
    100%{ transform:translateY(-360px) translateX(var(--drift,20px)); opacity:0; }
  }

  .news-banner{
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 500px 200px at 20% 0%, rgba(207,154,68,0.18), transparent 70%),
      linear-gradient(135deg, #14172a 0%, #1b1e30 100%);
    border:1px solid rgba(207,154,68,0.18);
    border-radius:8px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .news-banner .starfield{ opacity:0.25; }

  /* ---- marketing page (login screen) ---- */
  html{ scroll-behavior:smooth; }
  .site-nav{
    position:fixed; top:16px; left:16px; right:16px; z-index:40;
    background:linear-gradient(90deg, #0b2027 0%, #123641 60%, #17424e 100%);
    border:1px solid #c6af8d;
    border-radius:14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .site-nav-inner{
    max-width:1200px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:24px;
  }
  .nav-brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .nav-brand-name{ font-family: Georgia, "Iowan Old Style", serif; font-weight:700; color:#f0dfb4; font-size:16px; letter-spacing:0.02em; }
  .nav-links{ display:flex; gap:2px; flex:1; flex-wrap:wrap; align-items:center; }
  .nav-link{ font-size:13px; font-weight:600; color:#cfe3e6; letter-spacing:0.01em; padding:8px 12px; border-radius:4px; transition:background 0.12s ease; }
  .nav-link:hover{ color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); }
  .nav-cta-group{ display:flex; gap:10px; align-items:center; flex-shrink:0; }
  .btn-nav-outline{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:#cfe3e6; background:transparent; border:1px solid rgba(207,227,230,0.4); border-radius:2px; padding:8px 14px;
  }
  .btn-nav-outline:hover{ background:rgba(255,255,255,0.08); text-decoration:none; }
  .btn-nav-solid{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:#1b130a; background:linear-gradient(180deg, #cf9a44 0%, #9c6a28 100%);
    border:1px solid rgba(255,224,153,0.5); border-radius:2px; padding:8px 16px;
  }
  .btn-nav-solid:hover{ text-decoration:none; background:linear-gradient(180deg, #e0b264 0%, #b17c34 100%); }
  @media (max-width:900px){ .nav-links{ display:none; } }

  .app-nav-links{ display:flex; gap:2px; flex-wrap:wrap; align-items:center; }
  .nav-tab-btn{
    background:none; border:none;
    padding:8px 12px; border-radius:4px; font-size:13px; font-weight:600; color:#cfe3e6;
    font-family: inherit; letter-spacing:0.01em; transition:background 0.12s ease;
  }
  .nav-tab-btn:hover{ color:#fff; background:rgba(255,255,255,0.12); }
  .nav-tab-btn.active{ color:#f0dfb4; background:rgba(207,154,68,0.18); }
  @media (max-width:900px){ .app-nav-links{ display:none; } }
  .nav-user{ font-size:13px; color:#cfe3e6; display:flex; align-items:center; gap:8px; white-space:nowrap; }

  .marketing-hero{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, #2f2619 0%, #4a3c29 12%, #5d4d38 24%, #6c5a3e 42%, var(--bg-primary) 85%, var(--bg-primary) 100%);
    padding:110px 24px 0 24px;
  }
  .hero-split{
    max-width:1200px; margin:0 auto; padding-bottom:60px;
    display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;
  }
  .hero-split-text .eyebrow{ color:#f0dfb4; -webkit-text-fill-color:initial; background:none; }
  .hero-title2{ font-family: Georgia, "Iowan Old Style", serif; font-size:44px; font-weight:700; margin-bottom:18px; line-height:1.1; }

<script>
(function(){

/* ---------------- storage helpers ---------------- */
async function sGet(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function sSet(key, value, retries=2){
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      await window.storage.set(key, JSON.stringify(value), true);
      return true;
    }catch(e){
      console.error("storage set failed", key, e, "attempt", attempt);
      if(attempt<retries) await new Promise(r=>setTimeout(r, 350 * (attempt+1)));
    }
  }
  return false;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

/* ---------------- lightweight rich text (self-contained, no external libs) ---------------- */
function rteParseInline(text){
  text = text.replace(/`([^`]+)`/g, (m,p1)=>`<code>${p1}</code>`);
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  text = text.replace(/__([^_]+)__/g, '<u>$1</u>');
  text = text.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  text = text.replace(/\{color:(#[0-9a-fA-F]{3,6})\}([\s\S]*?)\{\/color\}/g, (m,color,inner)=>`<span style="color:${color}">${inner}</span>`);
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return text;
}
function renderRichText(raw){
  if(!raw) return '';
  const escaped = esc(raw);
  const lines = escaped.split('\n');
  let html = '', inList = null, inQuote = false;
  function closeList(){ if(inList){ html += inList==='ul' ? '</ul>' : '</ol>'; inList=null; } }
  function closeQuote(){ if(inQuote){ html += '</blockquote>'; inQuote=false; } }
  lines.forEach(line=>{
    const t = line.trim();
    let m;
    if(t===''){ closeList(); closeQuote(); return; }
    if(m = t.match(/^### (.*)$/)){ closeList(); closeQuote(); html += `<h4 style="margin:10px 0 4px 0;">${rteParseInline(m[1])}</h4>`; return; }
    if(m = t.match(/^## (.*)$/)){ closeList(); closeQuote(); html += `<h3 style="margin:12px 0 6px 0;">${rteParseInline(m[1])}</h3>`; return; }
    if(m = t.match(/^# (.*)$/)){ closeList(); closeQuote(); html += `<h2 style="margin:14px 0 6px 0;">${rteParseInline(m[1])}</h2>`; return; }
    if(m = t.match(/^&gt; (.*)$/)){
      closeList();
      if(!inQuote){ html += '<blockquote style="margin:6px 0; padding:6px 14px; border-left:3px solid var(--divider-strong); color:var(--text-muted);">'; inQuote=true; }
      html += `<div>${rteParseInline(m[1])}</div>`;
      return;
    } else { closeQuote(); }
    if(m = t.match(/^- (.*)$/)){
      closeQuote();
      if(inList!=='ul'){ closeList(); html += '<ul style="margin:6px 0; padding-left:22px;">'; inList='ul'; }
      html += `<li>${rteParseInline(m[1])}</li>`;
      return;
    }
    if(m = t.match(/^\d+\. (.*)$/)){
      closeQuote();
      if(inList!=='ol'){ closeList(); html += '<ol style="margin:6px 0; padding-left:22px;">'; inList='ol'; }
      html += `<li>${rteParseInline(m[1])}</li>`;
      return;
    }
    closeList(); closeQuote();
    html += `<p style="margin:0 0 8px 0; line-height:1.6;">${rteParseInline(line)}</p>`;
  });
  closeList(); closeQuote();
  return html;
}
function rteApply(textareaId, action, colorValue){
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(end);
  let insert = selected;

  function wrap(pre, post, placeholder){
    const body = selected || placeholder;
    insert = pre + body + post;
  }

  switch(action){
    case 'bold': wrap('**','**','bold text'); break;
    case 'italic': wrap('*','*','italic text'); break;
    case 'underline': wrap('__','__','underlined text'); break;
    case 'strike': wrap('~~','~~','strikethrough text'); break;
    case 'code': wrap('`','`','code'); break;
    case 'h1': wrap('# ','','Heading'); break;
    case 'h2': wrap('## ','','Subheading'); break;
    case 'ul': wrap('- ','','list item'); break;
    case 'ol': wrap('1. ','','list item'); break;
    case 'quote': wrap('> ','','quoted text'); break;
    case 'link': {
      const label = selected || 'link text';
      insert = `[${label}](https://)`;
      break;
    }
    case 'color': {
      const body = selected || 'colored text';
      insert = `{color:${colorValue}}${body}{/color}`;
      break;
    }
    default: return;
  }

  ta.value = before + insert + after;
  ta.focus();
  const pos = before.length + insert.length;
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input'));
}

};
function specGlyphKey(classKey, specKey){
  const cls = CLASS_SPECS[classKey];
  const spec = cls.specs.find(s=>s.key===specKey);
  return spec ? spec.glyph : 'orb';
}
function shadeColor(hex, percent){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  const adj = v => Math.min(255, Math.max(0, Math.round(v + 255*(percent/100))));
  return '#' + [adj(r),adj(g),adj(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
let __iconUid = 0;
function specIconSvg(classKey, specKey){
  const inner = GLYPHS[specGlyphKey(classKey,specKey)] || GLYPHS.orb;
  const c = CLASS_SPECS[classKey].color;
  const light = shadeColor(c, 42);
  const dark = shadeColor(c, -62);
  const id = 'pi' + (__iconUid++);
  return `<svg viewBox="0 0 24 24" class="painted-icon">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0%" stop-color="${light}"/>
        <stop offset="55%" stop-color="${c}"/>
        <stop offset="100%" stop-color="${dark}"/>
      </linearGradient>
    </defs>
    <g fill="url(#${id})" fill-opacity="0.32" stroke="${dark}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${inner}</g>
    <g fill="none" stroke="url(#${id})" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${inner}</g>
    <g fill="none" stroke="${light}" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">${inner}</g>
  </svg>`;
}
function specIconStyle(classKey){
  const c = CLASS_SPECS[classKey].color;
  return `border-color:${c}; color:${c}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.75), inset 0 -3px 5px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.16), 0 0 9px ${c}77, 0 0 2px ${c}bb;`;
}

function isoFromParts(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayISO(){ const d=new Date(); return isoFromParts(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekdayOfMonth(y,m){ return new Date(y, m, 1).getDay(); }

/* ---------------- setup / login ---------------- */
async function handleSetup(){
  const c = document.getElementById('setup-form');
  const guildName = (c.querySelector('[name=guildName]').value||'').trim();
  const memberPass = c.querySelector('[name=memberPass]').value||'';
  const officerPass = c.querySelector('[name=officerPass]').value||'';
  const officerName = (c.querySelector('[name=officerName]').value||'').trim();
  let err = '';
  if(!guildName) err = 'Enter a guild name.';
  else if(!memberPass || !officerPass) err = 'Both passphrases are required.';
  else if(memberPass === officerPass) err = 'Member and officer passphrases must be different.';
  else if(!officerName) err = 'Enter your character name.';
  const errEl = document.getElementById('setup-error');
  if(err){ errEl.textContent = err; errEl.style.display='block'; return; }
  const config = { guildName, memberPass, officerPass };
  const ok = await sSet('guild-config', config);
  if(!ok){ errEl.textContent = "Couldn't save to the server — check your connection and try again."; errEl.style.display='block'; return; }
  state.config = config;
  state.currentUser = { name: officerName, role: 'officer' };
  state.view = 'app';
  state.tab = 'news';
  render();
}

async function handleLogin(){
  const c = document.getElementById('login-form');
  const name = (c.querySelector('[name=charName]').value||'').trim();
  const pass = c.querySelector('[name=pass]').value||'';
  const errEl = document.getElementById('login-error');
  if(!name){ errEl.textContent = 'Enter your character name.'; errEl.style.display='block'; return; }
  let role = null;
  if(pass === state.config.officerPass) role = 'officer';
  else if(pass === state.config.memberPass) role = 'member';
  if(!role){ errEl.textContent = "That passphrase doesn't match. Check with an officer."; errEl.style.display='block'; return; }
  state.currentUser = { name, role };
  state.view = 'app';
  state.tab = 'news';
  render();
}

function handleLogout(){
  state.currentUser = null;
  state.view = 'login';
  render();
}

async function addEvent(){

  const ev = { id: uid(), title, date, time, instance, notes };
  const events = [...state.events, ev].sort((a,b)=> a.date.localeCompare(b.date));
  const ok = await sSet('guild-events', events);
  state.events = events;
  state.modal = null;

async function deleteEvent(id){

  state.events = events; state.rsvps = rsvps;
  state.modal = null;
  saveNotice(results.every(Boolean), 'Event removed');
  render();

  const ok = await sSet('guild-rsvps', rsvps);

function handleScreenshotFile(bossId, file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file'); return; }
  const MAX_BYTES = 4 * 1024 * 1024; // stay well under the 5MB per-key storage limit
  if(file.size > MAX_BYTES){ showToast('That image is too large (max ~4MB) — try a smaller screenshot'); return; }
  const reader = new FileReader();
  reader.onload = () => saveBossScreenshot(bossId, reader.result);
  reader.onerror = () => showToast("Couldn't read that file — try again");
  reader.readAsDataURL(file);
}

function selectSpec(classKey, specKey){
  if(state.currentUser.role !== 'officer') return;
  if(state.selectedSpec && state.selectedSpec.classKey===classKey && state.selectedSpec.specKey===specKey){
    state.selectedSpec = null;
  } else {
    state.selectedSpec = { classKey, specKey };
  }
  render();
}
function openCompSlotModal(groupIdx, slotIdx){
  if(state.currentUser.role !== 'officer') return;
  if(!state.selectedSpec){ showToast('Pick a class/spec above first'); return; }
  state.modal = { type:'assign-slot', groupIdx, slotIdx };
  render();
}
async function saveCompSlot(){
  if(!state.modal || state.modal.type !== 'assign-slot') return;
  if(state.currentUser.role !== 'officer'){ showToast('Only officers can edit the roster'); state.modal=null; render(); return; }
  const { groupIdx, slotIdx } = state.modal;
  if(!state.selectedSpec){ showToast('Pick a class/spec above first'); state.modal=null; render(); return; }
  const nameInput = document.getElementById('assign-slot-name');

  const errEl = document.getElementById('assign-slot-error');
  if(!name){ errEl.textContent = 'Enter a raider name.'; errEl.style.display = 'block'; return; }
  const comp = JSON.parse(JSON.stringify(state.comp));
  comp.groups[groupIdx][slotIdx] = { classKey: state.selectedSpec.classKey, specKey: state.selectedSpec.specKey, name };
  const ok = await sSet('guild-comp', comp);
  state.comp = comp;
  state.modal = null;
  saveNotice(ok, 'Roster updated');
  render();
}
async function removeCompSlot(groupIdx, slotIdx){
  if(state.currentUser.role !== 'officer'){ showToast('Only officers can edit the roster'); return; }
  const comp = JSON.parse(JSON.stringify(state.comp));
  const slot = comp.groups[groupIdx][slotIdx];
  if(!slot) return;
  comp.groups[groupIdx][slotIdx] = null;
  const ok = await sSet('guild-comp', comp);
  state.comp = comp;
  state.modal = null;
  if(!ok) showToast("Couldn't save — try again");
  render();
}

function emberField(count){
  let out = '';
  for(let i=0;i<count;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*9).toFixed(2);
    const duration = (7 + Math.random()*6).toFixed(2);
    const drift = (Math.random()*40 - 20).toFixed(0);
    const size = (2 + Math.random()*2).toFixed(1);
    out += `<div class="ember" style="left:${left}%; width:${size}px; height:${size}px; animation-delay:${delay}s; animation-duration:${duration}s; --drift:${drift}px;"></div>`;
  }
  return out;
}

/* ---- calendar tab ---- */
function renderCalendar(){
  const isOfficer = state.currentUser.role === 'officer';
  const y = state.calendarYear, m = state.calendarMonth;
  const first = firstWeekdayOfMonth(y,m);
  const numDays = daysInMonth(y,m);
  const prevMonthDays = daysInMonth(m===0?y-1:y, m===0?11:m-1);
  const cells = [];
  for(let i=0;i<42;i++){
    const offset = i - first;
    let cy=y, cm=m, cd;
    if(offset < 0){ cd = prevMonthDays + offset + 1; cm = m===0?11:m-1; cy = m===0?y-1:y; }
    else if(offset >= numDays){ cd = offset - numDays + 1; cm = m===11?0:m+1; cy = m===11?y+1:y; }
    else { cd = offset + 1; }
    cells.push({ iso: isoFromParts(cy,cm,cd), day: cd, inMonth: offset>=0 && offset<numDays });
  }
  const today = todayISO();
  const eventsByDate = {};
  state.events.forEach(ev=>{ (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev); });

  return `
    <div class="eyebrow sans">Schedule</div>
    <h2 class="page-title">Raid calendar</h2>
    <p class="page-sub sans">Click any event to see details and mark yourself down for the night.</p>

    <div class="cal-header">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">&lsaquo;</button>
        <div class="cal-month-label">${MONTH_NAMES[m]} ${y}</div>
        <button class="cal-nav-btn" id="cal-next">&rsaquo;</button>
        <button class="btn secondary" id="cal-today" style="margin-left:6px;">Today</button>
      </div>
      ${ isOfficer ? `<button class="btn" id="cal-add-event">+ Add event</button>` : '' }
    </div>

    <div class="cal-grid">
      ${ WEEKDAY_LABELS.map(w=>`<div class="cal-weekday">${w}</div>`).join('') }
      ${ cells.map(c=>{
        const evs = eventsByDate[c.iso] || [];
        return `
        <div class="cal-cell ${c.inMonth?'':'other-month'} ${c.iso===today?'today':''}">
          <div class="cal-daynum">${c.day}</div>
          <div class="cal-events">
            ${ evs.map(ev=>`<button class="cal-event-pill" data-open-event="${ev.id}">${esc(ev.title)}</button>`).join('') }
          </div>
          ${ isOfficer ? `<button class="cal-add-btn" data-adddate="${c.iso}" title="Add event">+</button>` : '' }
        </div>`;
      }).join('') }
    </div>

    ${ renderModal() }
  `;
}

function renderEventDetailModal(eventId){

  const mine = rs[state.currentUser.name];
  const groups = { going:[], maybe:[], out:[] };
  Object.entries(rs).forEach(([name,status])=>{ if(groups[status]) groups[status].push(name); });
  function nameList(arr){ return arr.length ? esc(arr.join(', ')) : '<span class="muted">nobody yet</span>'; }
  return `
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-panel" id="modal-panel">
      <div class="modal-header">

        <button class="rsvp-btn ${mine==='going'?'sel-going':''}" data-modal-rsvp="going">Going</button>
        <button class="rsvp-btn ${mine==='maybe'?'sel-maybe':''}" data-modal-rsvp="maybe">Maybe</button>
        <button class="rsvp-btn ${mine==='out'?'sel-out':''}" data-modal-rsvp="out">Can't make it</button>
      </div>

      <div class="rule"></div>
      <div style="margin-top:14px;">
        <div style="margin-bottom:8px;"><span class="badge going">${groups.going.length} going</span> ${nameList(groups.going)}</div>
        <div style="margin-bottom:8px;"><span class="badge maybe">${groups.maybe.length} maybe</span> ${nameList(groups.maybe)}</div>
        <div style="margin-bottom:8px;"><span class="badge out">${groups.out.length} out</span> ${nameList(groups.out)}</div>
      </div>

      ${ isOfficer ? `
      <div class="rule"></div>
      <button class="btn danger" data-modal-delete-event="${ev.id}">Remove event</button>` : '' }
    </div>
  </div>`;
}

function renderStrategies(){
  const isOfficer = state.currentUser.role === 'officer';
  const nav = state.stratNav;

  // ---- level 3: boss detail ----
  if(nav.raidId && nav.bossId){
    const raid = state.raids.find(r=>r.id===nav.raidId);
    const boss = state.bossesIndex.find(b=>b.id===nav.bossId);
    if(!raid || !boss){ state.stratNav = {raidId:null,bossId:null}; return renderStrategies(); }
    const detail = state.bossDetails[boss.id];
    return `
      ${renderStratBreadcrumb(raid, boss)}

/* ---------------- event binding ---------------- */
function bindApp(){
  document.querySelectorAll('.nav-tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; state.modal = null; render(); });
  });
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', handleLogout);

  const eventBtn = document.getElementById('event-form-btn');
  if(eventBtn) eventBtn.addEventListener('click', addEvent);

  // calendar month navigation
  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    let m = state.calendarMonth - 1, y = state.calendarYear;
    if(m<0){ m=11; y--; }
    state.calendarMonth = m; state.calendarYear = y; render();
  });
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.addEventListener('click', ()=>{
    let m = state.calendarMonth + 1, y = state.calendarYear;
    if(m>11){ m=0; y++; }
    state.calendarMonth = m; state.calendarYear = y; render();
  });
  const calToday = document.getElementById('cal-today');
  if(calToday) calToday.addEventListener('click', ()=>{
    const d = new Date();
    state.calendarYear = d.getFullYear(); state.calendarMonth = d.getMonth(); render();
  });
  const calAddEvent = document.getElementById('cal-add-event');
  if(calAddEvent) calAddEvent.addEventListener('click', ()=>{ state.modal = {type:'add-event', date:''}; render(); });
  document.querySelectorAll('[data-adddate]').forEach(b=>b.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    state.modal = {type:'add-event', date:b.dataset.adddate}; render();
  }));
  document.querySelectorAll('[data-open-event]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = {type:'event-detail', eventId:b.dataset.openEvent}; render();
  }));

  // modal close (X button or backdrop click)
  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.addEventListener('click', ()=>{ state.modal=null; render(); });
  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop) backdrop.addEventListener('click', (ev)=>{ if(ev.target.id==='modal-backdrop'){ state.modal=null; render(); } });

  // rsvp / delete from within the event-detail modal
  document.querySelectorAll('[data-modal-rsvp]').forEach(b=>b.addEventListener('click', ()=>{
    if(state.modal && state.modal.type==='event-detail') setRsvp(state.modal.eventId, b.dataset.modalRsvp);
  }));
  const modalDelBtn = document.querySelector('[data-modal-delete-event]');
  if(modalDelBtn) modalDelBtn.addEventListener('click', ()=>deleteEvent(modalDelBtn.dataset.modalDeleteEvent));

  // boss strategies: raid > boss tree navigation
  document.querySelectorAll('[data-open-raid]').forEach(el=>el.addEventListener('click', ()=>{
    state.stratNav = { raidId: el.dataset.openRaid, bossId: null };
    render();
  }));
  document.querySelectorAll('[data-open-boss]').forEach(el=>el.addEventListener('click', ()=>{
    const bossId = el.dataset.openBoss;
    state.stratNav.bossId = bossId;
    render();
    loadBossDetail(bossId);
  }));
  document.querySelectorAll('[data-crumb-raids]').forEach(el=>el.addEventListener('click', ()=>{
    state.stratNav = { raidId:null, bossId:null };
    render();
  }));
  document.querySelectorAll('[data-crumb-raid]').forEach(el=>el.addEventListener('click', ()=>{
    state.stratNav = { raidId: el.dataset.crumbRaid, bossId:null };
    render();
  }));

  const raidAddBtn = document.getElementById('raid-add-btn');
  if(raidAddBtn) raidAddBtn.addEventListener('click', addRaidInstance);
  document.querySelectorAll('[data-del-raid]').forEach(b=>b.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    deleteRaidInstance(b.dataset.delRaid);
  }));

  const bossAddBtn = document.getElementById('boss-add-btn');
  if(bossAddBtn) bossAddBtn.addEventListener('click', ()=>addBoss(state.stratNav.raidId));
  document.querySelectorAll('[data-del-boss]').forEach(b=>b.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    deleteBoss(b.dataset.delBoss);
  }));

  const bossNotesSaveBtn = document.getElementById('boss-notes-save-btn');
  if(bossNotesSaveBtn) bossNotesSaveBtn.addEventListener('click', saveBossNotes);
  const screenshotInput = document.getElementById('boss-screenshot-input');
  if(screenshotInput) screenshotInput.addEventListener('change', (ev)=>{
    handleScreenshotFile(state.stratNav.bossId, ev.target.files[0]);
  });
  const screenshotRemoveBtn = document.getElementById('boss-screenshot-remove-btn');
  if(screenshotRemoveBtn) screenshotRemoveBtn.addEventListener('click', ()=>removeBossScreenshot(state.stratNav.bossId));

  const raidplanBtn = document.getElementById('raidplan-form-btn');
  if(raidplanBtn) raidplanBtn.addEventListener('click', addRaidplan);
  document.querySelectorAll('[data-del-raidplan]').forEach(b=>b.addEventListener('click', ()=>deleteRaidplan(b.dataset.delRaidplan)));

  const softresBtn = document.getElementById('softres-form-btn');
  if(softresBtn) softresBtn.addEventListener('click', addSoftres);
  document.querySelectorAll('[data-del-softres]').forEach(b=>b.addEventListener('click', ()=>deleteSoftres(b.dataset.delSoftres)));

  document.querySelectorAll('.spec-btn').forEach(b=>b.addEventListener('click', ()=>selectSpec(b.dataset.class, b.dataset.spec)));
  document.querySelectorAll('[data-slot-click]').forEach(el=>el.addEventListener('click', ()=>{
    const [gi,si] = el.dataset.slotClick.split('|').map(Number);
    openCompSlotModal(gi,si);
  }));
  document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const [gi,si] = b.dataset.remove.split('|').map(Number);
    removeCompSlot(gi,si);
  }));
  const assignSaveBtn = document.getElementById('assign-slot-save');
  if(assignSaveBtn){
    assignSaveBtn.addEventListener('click', saveCompSlot);
    const nameInput = document.getElementById('assign-slot-name');
    if(nameInput) nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') saveCompSlot(); });
  }
  const assignClearBtn = document.getElementById('assign-slot-clear');
  if(assignClearBtn && state.modal && state.modal.type==='assign-slot'){
    const { groupIdx, slotIdx } = state.modal;
    assignClearBtn.addEventListener('click', ()=>removeCompSlot(groupIdx, slotIdx));
  }

  const lootBtn = document.getElementById('loot-form-btn');
  if(lootBtn) lootBtn.addEventListener('click', addLoot);
  document.querySelectorAll('[data-del-loot]').forEach(b=>b.addEventListener('click', ()=>deleteLoot(b.dataset.delLoot)));

  const newsBtn = document.getElementById('news-form-btn');
  if(newsBtn) newsBtn.addEventListener('click', addNews);
  document.querySelectorAll('[data-del-news]').forEach(b=>b.addEventListener('click', ()=>deleteNews(b.dataset.delNews)));

  const newsBodyInput = document.getElementById('news-body-input');
  const newsPreview = document.getElementById('news-preview');
  function updateNewsPreview(){
    if(!newsBodyInput || !newsPreview) return;
    const val = newsBodyInput.value.trim();
    newsPreview.innerHTML = val ? renderRichText(val) : '<span class="muted">Nothing to preview yet.</span>';
  }
  if(newsBodyInput){
    newsBodyInput.addEventListener('input', updateNewsPreview);
    document.querySelectorAll('[data-rte]').forEach(b=>b.addEventListener('click', ()=>{
      rteApply('news-body-input', b.dataset.rte, '#cf9a44');
      updateNewsPreview();
    }));
    document.querySelectorAll('.rte-swatch').forEach(sw=>sw.addEventListener('click', ()=>{
      rteApply('news-body-input', 'color', sw.dataset.color);
      updateNewsPreview();
    }));
  }

  const recBtn = document.getElementById('rec-form-btn');
  if(recBtn) recBtn.addEventListener('click', saveRecruitment);
}

loadAll();
})();
</script>
</body>
</html>
