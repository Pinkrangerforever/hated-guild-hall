<style>
  :root{ --gold:#d6a940; --ink:#f0dfb4; --panel:rgba(22,14,8,0.88); --edge:rgba(214,169,64,0.45); --horde:#c8342a; --alliance:#3a72e0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b0806; color:var(--ink); font-family:Georgia, serif; }
  #stage{ position:fixed; inset:0; }
  #curtain{ position:fixed; inset:0; z-index:7; background:#000; display:flex; align-items:center; justify-content:center; transition:opacity 2.2s ease; }
  #curtain{ background:radial-gradient(ellipse at center, #1a1008 0%, #000 70%); flex-direction:column; }
  #curtain .crest{ width:84px; height:84px; margin-bottom:18px; filter:drop-shadow(0 0 14px rgba(214,169,64,0.45)); animation:breathe 3s ease-in-out infinite; }
  #curtain .title{ font:900 30px Cinzel, serif; letter-spacing:6px; text-transform:uppercase; text-align:center;
    color:#ecc867; text-shadow:0 1px 0 #fff1c4, 0 2px 3px #000, 0 0 18px rgba(214,169,64,0.45); animation:curtainIn .9s ease both; }
  #curtain .rule{ display:flex; align-items:center; gap:12px; width:min(420px, 80vw); margin:12px 0 10px; color:#d6a940; animation:curtainIn .9s ease both; }
  #curtain .rule::before, #curtain .rule::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg, transparent, #d6a940, transparent); }
  #curtain .msg{ font:600 13px Cinzel, serif; color:#a8875a; letter-spacing:3px; min-height:18px; transition:opacity .4s; animation:curtainIn 1.1s ease both; }
  #curtain .cbar{ width:min(260px, 60vw); height:3px; margin-top:16px; background:rgba(214,169,64,0.15); border-radius:2px; overflow:hidden; }
  #curtain .cbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg, #8a5a14, #ffd36a); box-shadow:0 0 8px #ffd36a; transition:width .4s ease; }
  @keyframes breathe{ 50%{ transform:scale(1.04); filter:drop-shadow(0 0 22px rgba(214,169,64,0.6)); } }
  @keyframes curtainIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  #curtain.gone{ opacity:0; pointer-events:none; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .wb-overlay{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .wb-label{ position:absolute; left:0; top:0; white-space:nowrap; padding:1px 6px; border-radius:9px; font-size:12px; line-height:1.4;
    background:rgba(30,22,14,0.82); border:1px solid rgba(214,169,64,0.5); color:#f4e6c8; transition:opacity .2s; }
  .wb-label.horde{ background:rgba(110,18,12,0.88); border-color:#ff8a70; }
  .wb-label.alliance{ background:rgba(16,40,110,0.88); border-color:#8ab4ff; }
  .wb-label.sel{ box-shadow:0 0 10px #ffd36a; border-color:#ffd36a; }
  .wb-label b{ font-weight:700; margin-right:1px; }
  .wb-label i{ font-style:normal; opacity:.75; margin-left:4px; }
  .wb-label s{ text-decoration:none; margin-left:4px; color:#ffd36a; }
  .wb-float{ position:absolute; left:0; top:0; font:700 16px Cinzel, serif; white-space:nowrap; text-shadow:0 2px 4px #000, 0 0 8px #000; color:#ffe9a8; }
  .wb-float.horde{ color:#ff9a80; } .wb-float.alliance{ color:#9cc0ff; } .wb-float.loss{ color:#ff5040; font-size:20px; } .wb-float.sum{ color:#ffd36a; font-size:13px; }

  .bar{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap;
    background:linear-gradient(rgba(10,6,3,0.95), rgba(10,6,3,0.6)); border-bottom:1px solid var(--edge); z-index:5; }
  .bar h1{ font:900 18px Cinzel, serif; margin:0; color:var(--gold); letter-spacing:2px; }
  .btn{ font:600 13px Cinzel, serif; color:var(--ink); background:linear-gradient(#4a3418,#2a1c0c); border:1px solid var(--edge); border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:var(--gold); color:#fff3cc; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.red{ background:linear-gradient(#7a1a12,#4a0e08); } .btn.blue{ background:linear-gradient(#1c3a80,#0e2050); }
  .btn.sm{ padding:3px 7px; font-size:11px; }
  .chip{ padding:3px 8px; border-radius:10px; background:rgba(0,0,0,0.4); border:1px solid rgba(214,169,64,0.3); font-size:13px; white-space:nowrap; }
  .score{ display:flex; gap:6px; align-items:center; font:700 14px Cinzel, serif; }
  .score .h{ color:#ff8a70; } .score .a{ color:#8ab4ff; }
  .spacer{ flex:1; }

  .panel{ position:fixed; z-index:4; padding:10px 12px; border-radius:8px;
    background:linear-gradient(180deg, rgba(38,26,14,0.94), rgba(18,12,7,0.94));
    border:1px solid #6b4f24; box-shadow:0 0 0 1px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(214,169,64,0.18), inset 0 1px 0 rgba(255,220,150,0.12), 0 10px 30px rgba(0,0,0,0.65); }
  .panel::before, .panel::after{ content:''; position:absolute; width:14px; height:14px; border:2px solid var(--gold); opacity:.75; pointer-events:none; }
  .panel::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; border-radius:8px 0 0 0; }
  .panel::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; border-radius:0 0 8px 0; }
  .ph{ display:flex; align-items:center; gap:9px; margin:-10px -12px 8px; padding:8px 12px; border-bottom:1px solid rgba(214,169,64,0.3);
    background:linear-gradient(90deg, var(--fac, rgba(214,169,64,0.18)), rgba(0,0,0,0)); border-radius:8px 8px 0 0; }
  .ph .crest{ width:34px; height:34px; border-radius:50%; border:2px solid var(--gold); background:#120b06; display:grid; place-items:center; overflow:hidden; flex:none; box-shadow:0 0 8px rgba(0,0,0,0.6); }
  .ph .crest img{ width:30px; height:30px; object-fit:cover; }
  .ph .t{ font:700 15px Cinzel, serif; color:#f4e2b4; line-height:1.1; text-shadow:0 1px 2px #000; }
  .ph .s{ font:600 11px Cinzel, serif; letter-spacing:1px; color:var(--facText, #c8a86a); text-transform:uppercase; }
  .sec{ font:700 10px Cinzel, serif; letter-spacing:1.5px; text-transform:uppercase; color:#a8875a; margin:9px 0 4px; display:flex; align-items:center; gap:6px; }
  .sec::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(214,169,64,0.35), rgba(214,169,64,0)); }
  .horde{ --fac:rgba(178,34,28,0.55); --facText:#ff9a80; } .alliance{ --fac:rgba(36,84,190,0.55); --facText:#9cc0ff; } .neutral{ --fac:rgba(140,120,80,0.35); --facText:#d6c7a0; }
  .ap{ display:flex; gap:4px; align-items:center; }
  .ap i{ width:12px; height:12px; transform:rotate(45deg); border:1px solid #c9a24a; background:#2a1c0c; display:inline-block; }
  .ap i.on{ background:linear-gradient(135deg,#ffe28a,#c98a1c); box-shadow:0 0 6px rgba(255,200,90,0.7); }
  .stat{ display:flex; align-items:center; gap:8px; }
  .big{ font:700 22px Cinzel, serif; color:#f4e2b4; line-height:1; }
  .lbl{ font-size:11px; color:#a8977a; }
  .resg{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .resg div{ display:flex; align-items:center; gap:7px; padding:4px 7px; border-radius:6px; background:rgba(0,0,0,0.35); border:1px solid rgba(214,169,64,0.14); }
  .resg img.ri{ width:22px; height:22px; } .resg b{ font:700 15px Cinzel, serif; color:#f4e2b4; } .resg small{ color:#8fc47a; font-size:11px; margin-left:auto; }
  .cardt{ display:inline-flex; align-items:center; gap:4px; padding:3px 7px; border-radius:5px; font-size:12px; background:linear-gradient(#3a2a14,#22170b); border:1px solid rgba(214,169,64,0.35); }
  .cardt b{ color:#ffd36a; }
  .warbar{ height:8px; border-radius:4px; overflow:hidden; display:flex; background:#000; border:1px solid rgba(214,169,64,0.25); }
  .warbar span{ display:block; height:100%; } .warbar .hb{ background:linear-gradient(#e0483a,#8e1a14); } .warbar .ab{ background:linear-gradient(#5a8cf0,#1d3f93); } .warbar .nb{ background:#4a4234; }
  .acts{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .act{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 4px; border-radius:7px; cursor:pointer; font:700 12px Cinzel, serif; color:#f0dfb4;
    background:linear-gradient(#4a3418,#24180b); border:1px solid rgba(214,169,64,0.45); }
  .act .ic{ font-size:18px; line-height:1; } .act:hover{ border-color:var(--gold); filter:brightness(1.15); }
  .act.on.red{ background:linear-gradient(#8e1f15,#4a0e08); border-color:#ff8a70; } .act.on.blue{ background:linear-gradient(#24489a,#0e2050); border-color:#8ab4ff; }
  .info{ font-size:12px; color:#c8b896; display:grid; grid-template-columns:18px 1fr; gap:3px 6px; align-items:center; }
  .info img.ri{ width:16px; height:16px; }
  .tgt{ margin-top:8px; padding:8px; border-radius:7px; background:rgba(0,0,0,0.35); border:1px solid rgba(214,169,64,0.25); }
  .vs{ display:flex; align-items:center; justify-content:space-between; font:700 13px Cinzel, serif; }
  .vs .n{ font-size:20px; }
  details.fold summary{ cursor:pointer; list-style:none; } details.fold summary::-webkit-details-marker{ display:none; }
  details.fold summary::before{ content:'▸ '; color:var(--gold); } details.fold[open] summary::before{ content:'▾ '; }
  #feedList .day{ text-align:center; font:700 10px Cinzel, serif; letter-spacing:2px; color:#a8875a; margin:8px 0 4px; display:flex; align-items:center; gap:6px; border:0; }
  #feedList .day::before, #feedList .day::after{ content:''; flex:1; height:1px; background:rgba(214,169,64,0.3); }
  #feedList .ev{ display:grid; grid-template-columns:22px 1fr; gap:6px; align-items:start; padding:5px 6px; margin:2px 0; border-radius:5px; border-left:3px solid #4a4234; background:rgba(0,0,0,0.22); border-bottom:0; }
  #feedList .ev.h{ border-left-color:#c8342a; } #feedList .ev.a{ border-left-color:#3a72e0; } #feedList .ev.hi{ background:linear-gradient(90deg, rgba(214,169,64,0.18), rgba(0,0,0,0.2)); }
  #feedList .ev .ico{ font-size:15px; text-align:center; line-height:1.2; }
  #feedList .ev .tx{ color:#e2d3b0; line-height:1.35; } #feedList .ev .tx b{ color:#ffd36a; }
  #feedList .ev.now{ outline:1px solid var(--gold); background:rgba(214,169,64,0.22); }
  .replay .btn.on{ border-color:var(--gold); color:#fff3cc; }
  .panel h3{ font:700 14px Cinzel, serif; color:var(--gold); margin:0 0 6px; }
  .wb-swing{ position:fixed; z-index:60; font-size:64px; pointer-events:none; transform-origin:80% 80%; translate:-70% -80%; animation:swing .45s ease-in forwards; filter:drop-shadow(0 4px 6px #000); }
  @keyframes swing{ 0%{ transform:rotate(-70deg); opacity:1; } 55%{ transform:rotate(25deg); } 75%{ transform:rotate(15deg); } 100%{ transform:rotate(20deg); opacity:0; } }
  #smashBar{ position:fixed; top:58px; left:50%; translate:-50% 0; z-index:40; display:none; align-items:center; gap:12px; padding:8px 16px; border-radius:10px;
    background:linear-gradient(#3a1a0c,#1c0c05); border:1px solid #d6a940; box-shadow:0 6px 20px rgba(0,0,0,.6); font:700 15px Cinzel, serif; color:#ffd36a; }
  body.smashing #stage canvas{ cursor:crosshair; }
  .smashNote{ text-align:center; margin-top:10px; color:#e6d3a8; font-size:14px; }
  .petln{ font-size:12px; color:#e6d3a8; margin-top:4px; }
  .scoutln{ font-size:12px; color:#cdb88a; margin-top:2px; text-align:right; cursor:help; }
  #me{ left:10px; top:62px; width:304px; font-size:14px; }
  #me .big{ font-size:24px; } #me .resg b{ font-size:16px; } #me .resg img.ri{ width:24px; height:24px; } #me .ph .t{ font-size:16px; } #me .ap i{ width:13px; height:13px; }
  #zone{ left:10px; bottom:10px; width:300px; max-height:calc(100vh - 80px); overflow-y:auto; overflow-x:hidden; z-index:5; }
  /* on short screens the zone panel takes over the left column and the commander panel steps aside */
  body.zoneOpen #me{ display:none; }
  @media (min-height: 1000px){ body.zoneOpen #me{ display:block; } #zone{ max-height:52vh; } }
  .panel, #feedList, #chatLog{ scrollbar-width:thin; scrollbar-color:#6b4f24 rgba(0,0,0,0.3); }
  .panel ::-webkit-scrollbar, .panel::-webkit-scrollbar{ width:8px; height:8px; }
  .panel ::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb{ background:#6b4f24; border-radius:4px; }
  .panel ::-webkit-scrollbar-track, .panel::-webkit-scrollbar-track{ background:rgba(0,0,0,0.3); }
  #feed{ right:10px; top:62px; width:300px; bottom:10px; display:flex; flex-direction:column; }
  #feedList{ flex:1; overflow:auto; font-size:12.5px; margin-top:6px; }
  #feedList div{ padding:4px 6px; border-bottom:1px solid rgba(214,169,64,0.12); }
  #feedList div.now{ background:rgba(214,169,64,0.18); }
  #feedList .h{ color:#ff9a80; } #feedList .a{ color:#9cc0ff; } #feedList .n{ color:#c8bca0; }
  .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:5px 0; }
  .res{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; font-size:13px; text-align:center; }
  .res div{ background:rgba(0,0,0,0.35); border-radius:6px; padding:3px 0; display:flex; align-items:center; justify-content:center; gap:4px; }
  img.ri{ width:20px; height:20px; object-fit:contain; vertical-align:middle; }
  .muted{ opacity:.7; font-size:12px; }
  input[type=range]{ flex:1; accent-color:var(--gold); }
  select, input[type=number], input[type=text]{ background:#1c130a; color:var(--ink); border:1px solid var(--edge); border-radius:5px; padding:3px 5px; font-family:inherit; }
  #chat{ left:50%; transform:translateX(-50%); bottom:10px; width:min(460px, calc(100vw - 660px)); min-width:300px; padding:0; display:flex; flex-direction:column; }
  #chat .tabs{ display:flex; border-bottom:1px solid var(--edge); }
  #chat .tabs button{ flex:1; background:none; border:0; color:var(--ink); font:600 12px Cinzel, serif; padding:7px; cursor:pointer; opacity:.6; }
  #chat .tabs button.on{ opacity:1; color:var(--gold); border-bottom:2px solid var(--gold); }
  #chat .tabs .min{ flex:0 0 32px; }
  #chatLog{ height:150px; overflow:auto; padding:6px 10px; font-size:13px; }
  #chatLog .m{ margin:2px 0; word-wrap:break-word; } #chatLog .t{ opacity:.45; font-size:11px; margin-right:4px; }
  #chatLog .h{ color:#ff9a80; font-weight:700; } #chatLog .a{ color:#9cc0ff; font-weight:700; } #chatLog .n{ color:#d6c7a0; font-weight:700; }
  #chatLog .sys{ opacity:.6; font-style:italic; }
  #chat form{ display:flex; gap:6px; padding:6px 8px; border-top:1px solid rgba(214,169,64,0.2); }
  #chat input{ flex:1; }
  #chat.min #chatLog, #chat.min form{ display:none; }
  #chat .badge{ background:#b3221c; color:#fff; border-radius:8px; padding:0 5px; font-size:10px; margin-left:4px; }
  #endScreen{ position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(10,6,3,0.78), rgba(0,0,0,0.93)); animation:endIn .8s ease; }
  #endScreen.show{ display:flex; }
  @keyframes endIn{ from{ opacity:0; } to{ opacity:1; } }
  .endWrap{ width:min(980px, 96vw); max-height:94vh; overflow-y:auto; overflow-x:hidden; padding:24px 36px 10px; box-sizing:border-box; }
  .endHead{ text-align:center; margin-bottom:112px; font:600 13px Cinzel, serif; letter-spacing:3px; color:#a8875a; }
  .endCols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .endSide{ position:relative; padding:40px 16px 16px; overflow:visible; border-radius:10px; text-align:center;
    background:linear-gradient(180deg, var(--c1), rgba(12,8,4,0.95) 60%); border:2px solid var(--c2); box-shadow:0 0 40px var(--glow), inset 0 0 0 1px rgba(0,0,0,0.6); }
  .endSide.horde{ --c1:rgba(150,24,16,0.85); --c2:#e0563f; --glow:rgba(220,60,40,0.45); --tx:#ff9a80; }
  .endSide.alliance{ --c1:rgba(24,58,150,0.85); --c2:#5a8cf0; --glow:rgba(70,120,240,0.45); --tx:#9cc0ff; }
  .endSide.lost{ filter:saturate(0.4) brightness(0.72); box-shadow:none; }
  .banner{ position:absolute; top:-26px; width:62px; height:112px; background:linear-gradient(var(--c2), var(--c1));
    clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); display:flex; align-items:flex-start; justify-content:center; padding-top:16px; }
  .banner::before{ content:""; position:absolute; top:0; left:0; right:0; height:7px; background:#d6a940; }
  .banner img{ width:34px; height:34px; border-radius:50%; border:2px solid #d6a940; background:#120b06; }
  .endSide:not(.lost) .banner{ animation:wave 2.4s ease-in-out infinite; transform-origin:top center; }
  .endSide.lost .banner{ transform:rotate(-8deg); transform-origin:top center; }
  @keyframes wave{ 50%{ transform:skewX(-4deg) rotate(1.5deg); } }
  .banner.l{ left:22px; } .banner.r{ right:22px; }
  .verdict{ font:900 46px Cinzel, serif; letter-spacing:4px; color:var(--tx); text-shadow:0 0 18px var(--glow), 0 3px 6px #000; line-height:1; }
  .endSide:not(.lost) .verdict{ animation:glowp 2s ease-in-out infinite; }
  @keyframes glowp{ 50%{ text-shadow:0 0 34px var(--c2), 0 3px 6px #000; } }
  .facName{ font:700 15px Cinzel, serif; color:#f4e2b4; letter-spacing:2px; margin:6px 0 2px; }
  .final{ font:700 30px Cinzel, serif; color:#f4e2b4; } .final small{ font-size:12px; color:#a8977a; letter-spacing:1px; }
  .roster{ width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; text-align:left; }
  .roster th{ font:700 10px Cinzel, serif; letter-spacing:1px; color:#a8875a; padding:4px 6px; border-bottom:1px solid rgba(214,169,64,0.35); text-transform:uppercase; }
  .roster td{ padding:5px 6px; border-bottom:1px solid rgba(214,169,64,0.1); color:#e2d3b0; }
  .roster td.n, .roster th.n{ text-align:right; font-variant-numeric:tabular-nums; }
  .roster tr.mvp td{ background:rgba(214,169,64,0.14); } .roster tr.mvp td:first-child::before{ content:"👑 "; }
  .roster td.sc{ font-weight:700; color:#ffd36a; }
  .endBtns{ display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .flagStage{ position:absolute; top:-96px; width:190px; height:250px; pointer-events:none; }
  .flagStage.l{ left:-34px; } .flagStage.r{ right:-34px; }
  .flagStage canvas{ width:100%; height:100%; display:block; }
  .endSide.has3d .banner{ display:none; }
  .endSide.lost .flagStage{ filter:saturate(0.5) brightness(0.8); }
  .endTitle{ position:relative; z-index:2; text-align:center; font:900 20px Cinzel, serif; letter-spacing:8px; color:#d6a940; text-shadow:0 0 14px rgba(214,169,64,0.5); margin-bottom:6px; }
  .endHead::before, .endHead::after{ content:"✦"; margin:0 10px; color:#d6a940; }
  .embers{ position:absolute; inset:0; overflow:hidden; border-radius:10px; pointer-events:none; }

// Any start-up failure shows on screen instead of leaving a blank room
function showFatal(msg){
  const g = document.getElementById('gate'); if(!g) return;

  const m = document.getElementById('gateMsg');

  m.innerHTML += '<br><code style="font-size:12px;color:#ff9a80">' + String(msg).replace(/</g, '&lt;') + '</code>';  // keep every error, the first is usually the cause
}

function save(){ try{ localStorage.setItem(STORE, JSON.stringify(G)); }catch(e){} }

function seen(){ try{ return +localStorage.getItem(SEEN) || 0; }catch(e){ return 0; } }

// ---------- boot ----------
(async function boot(){
  let session = null, profile = null;
  const timeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ' timed out')), ms))]);
  try{
    const r = await timeout(sb.auth.getSession(), 8000, 'Sign-in check'); session = r.data.session;
    if(session){ const p = await timeout(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(), 8000, 'Profile load'); profile = p.data; }
  }catch(e){ console.warn(e); showFatal(e.message); return; }
  const admin = !!(profile && profile.protected) || LOCAL;
  if(!admin){
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateMsg').textContent = session ? 'The Guild War is being tested by the officers. Check back soon!' : 'Sign in on the main site first.';
    return;
  }
  me = { id: profile ? profile.id : 'local-admin', name: profile ? (profile.character_name || 'Admin') : 'Admin', admin, signedIn: !!session };
  initChat();
  document.getElementById('adminBtn').style.display = '';
  try{ board = new WarBoard(document.getElementById('stage'), { onClick: zoneClicked, onHover: zoneHover, onEgg: (k, msg) => toast(msg), onSmash: smashClick }); }
  catch(e){ showFatal('3D board: ' + e.message + ' (is WebGL / hardware acceleration turned on?)'); return; }
  G = load();
  if(G && (!G.v || !G.zones)) G = null;   // old or broken save
  // wars started before rich deposits existed: pick this war's deposits now so their icons show
  // crystal was renamed gold: carry any crystal a player already had over to gold
  if(G && G.players) Object.values(G.players).forEach(p => { if(p.res && 'crystal' in p.res){ p.res.gold = (p.res.gold || 0) + p.res.crystal; delete p.res.crystal; save(); } });
  if(G && G.phase !== 'signup' && !G.rich){ G.rich = E.pickRich(Math.random); save(); }
  if(!G){ G = E.newGame({ sandbox: true }); save(); }
  if(!playAs || !G.players[playAs]) playAs = G.players[me.id] ? me.id : (Object.keys(G.players)[0] || me.id);
  // Replay: show the board as it was when you last looked, then play everything since
  const last = Math.min(seen(), G.seq);
  const view = JSON.parse(JSON.stringify(G));
  const pending = G.log.filter(e => e.seq > last);
  for(let i = pending.length - 1; i >= 0; i--){ const e = pending[i]; if(e.zones) Object.keys(e.zones).forEach(k => { view.zones[k] = JSON.parse(JSON.stringify(e.zones[k].before)); }); }
  board.setState(view);
  refreshUI();
  // black until everything has loaded, then fade in and sweep down onto the table
  const lines = ['Lighting the braziers', 'Unrolling the war map', 'Mustering the troops', 'Raising the banners', 'Sharpening the axes', 'Polishing the shields'];
  let li = 0, peak = 1;
  const tick = setInterval(() => {
    const m = document.getElementById('curtainMsg'); m.style.opacity = 0;
    setTimeout(() => { m.textContent = lines[++li % lines.length]; m.style.opacity = 1; }, 400);
  }, 1800);
  const prog = setInterval(() => { peak = Math.max(peak, board._loading || 0); const done = peak ? 1 - (board._loading || 0) / peak : 0; document.getElementById('curtainBar').style.width = Math.round(Math.max(5, done * 100)) + '%'; }, 150);
  await Promise.all([board.whenLoaded(), new Promise(r => setTimeout(r, 4200))]);   // stay up long enough to read, even on a fast load
  if(G.phase === 'ended' && G.smash && G.smash.length) board.smashReplay(G.smash);
  if(G.phase === 'ended') smashChannel();
  clearInterval(tick); clearInterval(prog); document.getElementById('curtainBar').style.width = '100%'; document.getElementById('curtainMsg').textContent = 'To war!';
  await new Promise(r => setTimeout(r, 1400));
  document.getElementById('curtain').classList.add('gone');
  await new Promise(r => setTimeout(r, 900));
  await board.intro();
  if(pending.length){ toast(`${pending.length} moves since you last looked: replaying`); pending.forEach(e => queue.push(e)); runQueue(); }
  else markSeen(G.seq);
})();

// ---------- chat: board (everyone) + your faction's private channel, live via Supabase realtime ----------
let chatChan = 'board', chatMsgs = [], chatFactionSynced = null, unread = { board: 0, faction: 0 };
function myFaction(){ const p = G && G.players && G.players[playAs]; return p ? p.faction : null; }
function initChat(){
  if(!me.signedIn){ document.getElementById('chatLog').innerHTML = '<div class="m sys">Sign in on the main site to use chat.</div>'; return; }
  sb.channel('guild-war-chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guild_war_chat' }, ({ new: m }) => {
    if(chatMsgs.some(x => x.id === m.id) || new Date(m.created_at) < chatSince()) return;
    chatMsgs.push(m); const ch = m.channel === 'board' ? 'board' : 'faction';
    if(ch !== chatChan || document.getElementById('chat').classList.contains('min')) unread[ch]++;
    renderChat();
  }).subscribe();
  setTimeout(loadChat, 0);   // after boot has loaded the game, so only this war's messages show
}
// each war has its own chat: only messages sent since this game was created are shown (the game id is 'g' + its creation time)
const chatSince = () => new Date(G && /^g\d+$/.test(G.id) ? +G.id.slice(1) : 0);
async function loadChat(){
  if(!me || !me.signedIn) return;

      `<div class="m sys">${chatChan === 'board' ? 'Board chat: everyone can read this. Talk some trash.' : 'Only your faction can read this channel.'}</div>`);

async function sendChat(e){
  e.preventDefault();
  const inp = document.getElementById('chatIn'), body = inp.value.trim(); if(!body) return;
  if(!me.signedIn){ toast('Sign in on the main site to chat'); return; }
  const ch = chatChan === 'board' ? 'board' : myFaction();

  const { data, error } = await sb.rpc('post_war_chat', { p_channel: ch, p_body: body });
  if(error){ toast(error.message); return; }
  inp.value = ''; if(data && !chatMsgs.some(x => x.id === data.id)){ chatMsgs.push(data); renderChat(); }
}

// ---------- replay queue ----------
async function runQueue(){
  if(playing) return; playing = true;
  while(queue.length){
    if(paused){ await new Promise(r => setTimeout(r, 150)); continue; }
    const e = queue.shift();
    highlightFeed(e.seq);
    document.getElementById('rpInfo').textContent = queue.length ? `${queue.length} to go` : '';
    try{ await board.play(e); }catch(err){ console.error(err); board.applyAfter(e); }
    markSeen(e.seq);
  }
  playing = false;
  if(G.phase === 'ended' && !showEndScreen.shown){ showEndScreen.shown = true; showEndScreen(); }
  board.setState(JSON.parse(JSON.stringify(G)));    // settle on the true state
  document.getElementById('rpInfo').textContent = '';
  refreshUI();
}
function replayToggle(){ paused = !paused; document.getElementById('rpPlay').textContent = paused ? '▶' : '⏸'; }
function setSpeed(s){ board.speed = s; document.querySelectorAll('.replay .btn').forEach(b => b.classList.toggle('on', b.textContent === s + '×')); }
function replaySkip(){ const sp = board.speed; board.speed = 99; queue.forEach(e => board.applyAfter(e)); queue = []; markSeen(G.seq); setTimeout(() => { board.speed = sp; }, 50); }
function push(entry){ if(entry){ queue.push(entry); runQueue(); } }

// ---------- feed ----------
function describe(e){
  const P = id => esc(G.players[id] ? G.players[id].name : id);
  switch(e.type){
    case 'signup': return `${esc(e.name)} signed up`;
    case 'start': return `The war begins! Strongholds: Horde in ${e.strongholds.horde.map(ZN).join(', ')}; Alliance in ${e.strongholds.alliance.map(ZN).join(', ')}`;
    case 'join': return `${esc(e.name)} joined the ${e.faction}`;
    case 'deploy': return `${P(e.pid)} deployed ${e.n} to ${ZN(e.to)}`;
    case 'move': return `${P(e.pid)} marched ${e.n} from ${ZN(e.from)} to ${ZN(e.to)}${e.march ? ' (Forced March)' : ''}`;
    case 'attack': return `${P(e.pid)} attacked ${ZN(e.to)} from ${ZN(e.from)} with ${e.n}: ${e.captured ? '<b>captured it</b>' : 'repelled'} (lost ${e.attLost}, killed ${e.defLost})${e.aPet && e.aPet.fell ? ` · ${P(e.aPet.pid)}'s pet fell` : ''}${e.dPet && e.dPet.fell ? ` · ${P(e.dPet.pid)}'s pet fell` : ''}`;
    case 'pet': return `${P(e.pid)} stationed ${esc((G.players[e.pid] && G.players[e.pid].pet || {}).name || 'their pet')} in ${ZN(e.to)}`;
    case 'fortify': return `${P(e.pid)}${e.auto ? ' (autopilot)' : ''} fortified ${ZN(e.to)}`;
    case 'build': return `${P(e.pid)} built ${e.kind === 'stronghold' ? 'a stronghold' : 'an outpost'} in ${ZN(e.to)}`;
    case 'craft': return `${P(e.pid)} crafted ${e.kind}`;
    case 'shieldwall': return `${P(e.pid)} raised a Shield Wall in ${ZN(e.to)}`;
    case 'trade': return `${P(e.pid)} traded ${e.rate} ${e.give} for 1 ${e.get}`;
    case 'autopilot': return `Autopilot placed ${P(e.pid)}'s troops: ${Object.keys(e.placed).map(k => `${e.placed[k]} in ${ZN(k)}`).join(', ')}`;
    case 'dawn': return `☀ Day ${e.day + 1} dawns. Reinforcements: Horde ${e.reinforce.horde}, Alliance ${e.reinforce.alliance}`;
    case 'end': return `🏆 The war is over: ${e.result.winner === 'draw' ? 'a draw' : e.result.winner + ' wins'} (${e.result.score.horde.total} – ${e.result.score.alliance.total})`;
    default: return e.type;
  }
}
const FEED_ICON = { signup: '✍', start: '🎺', join: '🤝', deploy: '🪖', move: '🥾', attack: '⚔', fortify: '🧱', build: '🏗', craft: '📜', shieldwall: '🛡', trade: '⚖', pet: '🐾', autopilot: '🤖', dawn: '☀', end: '🏆' };
function renderFeed(){
  const list = document.getElementById('feedList'); let lastDay = null, out = '';
  G.log.slice(-150).reverse().forEach(e => {
    if(e.day !== lastDay){ out += `<div class="day">Day ${e.day + 1}</div>`; lastDay = e.day; }
    const ico = e.type === 'attack' && e.captured ? '⚑' : FEED_ICON[e.type] || '•';
    const big = (e.type === 'attack' && e.captured) || e.type === 'end' || e.type === 'start';
    out += `<div data-seq="${e.seq}" class="ev ${FC(e.faction)} ${big ? "hi" : ""}"><span class="ico">${ico}</span><span class="tx">${describe(e)}</span></div>`;
  });
  list.innerHTML = out;
}
function highlightFeed(seq){
  document.querySelectorAll('#feedList .now').forEach(d => d.classList.remove('now'));
  const d = document.querySelector(`#feedList [data-seq="${seq}"]`); if(d) d.classList.add('now');
}

function cur(){ return G.players[playAs]; }
// ---------- ledger: who is on which side, and who has acted today ----------
function toggleLedger(){ const l = document.getElementById('ledger'); l.classList.toggle('show'); if(l.classList.contains('show')) renderLedger(); }
function renderLedger(){
  const l = document.getElementById('ledger'); if(!l.classList.contains('show')) return;
  const d = E.day(G), players = Object.values(G.players);
  if(!players.length){ l.innerHTML = `<div class="ph"><div class="crest" style="font-size:18px">📒</div><div><div class="t">War Ledger</div><div class="s">No one has enlisted yet</div></div></div>`; return; }
  const col = f => {

      ${list.map(p => `<div class="ledRow ${p.id === playAs ? 'me' : ''}"><span>${esc(p.name)}${p.bot ? ' <span class="tag">bot</span>' : ''}</span>
        <span class="ap" title="${p.ap} AP left">${Array.from({ length: E.RULES.apPerDay }, (_, i) => `<i class="${i < p.ap ? 'on' : ''}"></i>`).join('')}</span>
        <span class="st ${p.lastActiveDay === d ? 'done' : 'wait'}">${p.lastActiveDay === d ? '✓ Moved today' : p.reinforce ? `⏳ ${p.reinforce} troops waiting` : '⏳ Not yet'}</span></div>`).join('')}
    </div>`;
  };
  l.innerHTML = `<div class="ph"><div class="crest" style="font-size:18px">📒</div><div style="flex:1"><div class="t">War Ledger</div><div class="s">Day ${d + 1} · who serves where</div></div><button class="btn sm" onclick="toggleLedger()">✕</button></div>
    <div class="ledCols">${col('horde')}${col('alliance')}</div>
    <div class="muted" style="margin-top:8px">Anyone who hasn't acted by 11:59pm goes on autopilot: their waiting troops are placed on threatened zones, and 2 of their AP fortify two of their zones.</div>`;
}
// ---------- the rule book ----------
let ruleOpen = 'overview';
function placePamphlet(){
  const pm = document.getElementById('pamphlet'), me = document.getElementById('me');
  const visible = me && getComputedStyle(me).display !== 'none';
  pm.style.top = (visible ? me.offsetTop + me.offsetHeight + 10 : 62) + 'px';
}
// The book's journey: the little book flies to the centre (300x400, closed), opens its cover, flips six
// pages, and the open spread grows out of it with the text fading in. Closing runs it all backwards and
// the book flies home to the little icon.
let bookBusy = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const anim = (el, frames, ms, easing, delay) => el.animate(frames, { duration: ms, easing: easing || 'cubic-bezier(.4,0,.2,1)', delay: delay || 0, fill: 'forwards' }).finished;
function bookGeometry(){
  const mini = document.querySelector('#pamphlet .mini').getBoundingClientRect(), book = document.getElementById('openBook');
  const home = `translate(${mini.left + mini.width / 2 - innerWidth / 2 - 150}px, ${mini.top + mini.height / 2 - innerHeight / 2}px) scale(${mini.height / 400}) rotateY(-18deg)`;
  // the open fly-book is 600x400 centred; the spread starts at that size
  const small = `scale(${600 / book.offsetWidth}, ${400 / book.offsetHeight})`;
  return { home, small };
}
async function openRules(id){
  if(bookBusy) return; bookBusy = true;
  if(id) ruleOpen = id;
  renderRules();
  const rb = document.getElementById('rulebook'), fly = document.getElementById('flyBook'), book = document.getElementById('openBook');
  const cover = fly.querySelector('.fb-cover'), pages = [...fly.querySelectorAll('.fb-page:not(.last)')];
  rb.classList.add('show'); book.style.visibility = 'hidden'; book.classList.add('blank');
  fly.style.display = 'block'; fly.style.opacity = 1;
  pages.forEach(p => p.getAnimations().forEach(a => a.cancel())); cover.getAnimations().forEach(a => a.cancel());
  const g = bookGeometry();
  document.getElementById('pamphlet').style.visibility = 'hidden';
  requestAnimationFrame(() => rb.classList.add('dim'));
  await anim(fly, [{ transform: g.home }, { transform: 'translateX(150px) scale(1)' }], 700, 'cubic-bezier(.25,.8,.3,1)');
  await anim(cover, [{ transform: 'rotateY(0)' }, { transform: 'rotateY(-178deg)' }], 650, 'cubic-bezier(.5,0,.3,1)');
  pages.forEach((p, i) => anim(p, [{ transform: 'rotateY(0)' }, { transform: `rotateY(${-176 + i * 1.5}deg)` }], 420, 'cubic-bezier(.5,0,.4,1)', i * 95));
  await wait(6 * 95 + 380);
  // the spread grows out of the open fly-book
  book.style.visibility = 'visible';
  anim(fly, [{ opacity: 1 }, { opacity: 0 }], 260);
  await anim(book, [{ opacity: 0, transform: g.small }, { opacity: 1, transform: 'scale(1)' }], 420, 'cubic-bezier(.2,.7,.25,1)');
  fly.style.display = 'none';
  book.classList.remove('blank');
  document.getElementById('ruleSearch').focus();
  bookBusy = false;
}
async function closeRules(){
  const rb = document.getElementById('rulebook'); if(!rb.classList.contains('show') || bookBusy) return; bookBusy = true;
  const fly = document.getElementById('flyBook'), book = document.getElementById('openBook');
  const cover = fly.querySelector('.fb-cover'), pages = [...fly.querySelectorAll('.fb-page:not(.last)')], g = bookGeometry();
  book.classList.add('blank'); await wait(180);
  // the spread shrinks back into the open fly-book
  fly.style.display = 'block'; anim(fly, [{ opacity: 0 }, { opacity: 1 }], 240);
  await anim(book, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: g.small }], 360, 'cubic-bezier(.5,0,.75,.3)');
  book.style.visibility = 'hidden';
  // pages fall back, the cover shuts
  pages.slice().reverse().forEach((p, i) => anim(p, [{ transform: getComputedStyle(p).transform }, { transform: 'rotateY(0)' }], 300, 'cubic-bezier(.5,0,.4,1)', i * 55));
  await wait(6 * 55 + 220);
  await anim(cover, [{ transform: 'rotateY(-178deg)' }, { transform: 'rotateY(0)' }], 480, 'cubic-bezier(.5,0,.3,1)');
  // and home to the little book
  rb.classList.remove('dim');

const PET_TYPES_WAR = ['gryphon', 'dragon', 'cat'], PET_STAGES = ['juvenile', 'adult', 'boss'];
let petsLoading = false;
async function attachPets(){
  if(petsLoading || !G || !G.players) return;
  const todo = Object.values(G.players).filter(p => !p.petChecked); if(!todo.length) return;
  petsLoading = true;
  try{
    const real = todo.filter(p => !p.bot && /^[0-9a-f-]{36}$/.test(p.id));
    let rows = [];
    if(real.length){ const r = await sb.from('pets').select('user_id,pet_type,name,level,status').in('user_id', real.map(p => p.id)).neq('status', 'egg'); rows = r.data || []; }
    todo.forEach(p => {
      const row = rows.find(r => r.user_id === p.id);
      if(row) p.pet = { type: row.pet_type, status: row.status, level: Math.min(10, row.level || 1), name: row.name || 'Pet' };
      else if(p.bot && Math.random() < 0.7){ const lv = 1 + Math.floor(Math.random() * 10); p.pet = { type: PET_TYPES_WAR[Math.floor(Math.random() * 3)], status: lv >= 10 ? 'boss' : lv >= 5 ? 'adult' : 'juvenile', level: lv, name: ['Fluffy', 'Snaps', 'Ember', 'Biscuit', 'Talon', 'Mr. Whiskers'][Math.floor(Math.random() * 6)] }; }
      p.petChecked = true;
      // bots put their pet out straight away, on their faction's most threatened zone
      if(p.pet && p.bot && G.phase === 'live'){ const k = E.zonesOf(G, p.faction).filter(k => !E.petIn(G, k)).sort((a, b) => E.threat(G, b) - E.threat(G, a))[0]; if(k) E.placePet(G, p.id, k); }
    });
    save(); refreshUI();
  }catch(e){ console.warn('pets failed to load:', e); }
  petsLoading = false;
}

function doTrade(){
  const give = document.getElementById('trGive').value, get = document.getElementById('trGet').value, p = cur(), rate = E.tradeRate(G, p.faction);
  confirmBox('Trade with the bank?', `Give <b>${rate} ${RES_ICON[give]} ${give}</b> for <b>1 ${RES_ICON[get]} ${get}</b>.<br><span class="muted">You have ${p.res[give]} ${give}.</span>`, 'Trade', () => after(E.trade(G, playAs, give, get)));
}
// a small themed yes/no box
function confirmBox(title, body, yes, onYes){
  let el = document.getElementById('confirmBox');
  if(!el){ el = document.createElement('div'); el.id = 'confirmBox'; document.body.appendChild(el); }
  el.innerHTML = `<div class="panel cbx"><div class="ph"><div class="t">${title}</div></div><div style="font-size:13.5px;line-height:1.45">${body}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cbNo">Cancel</button><button class="btn red" id="cbYes">${yes}</button></div></div>`;
  el.classList.add('show');
  const close = () => el.classList.remove('show');
  document.getElementById('cbNo').onclick = close;
  document.getElementById('cbYes').onclick = () => { close(); onYes(); };
  el.onclick = e => { if(e.target === el) close(); };
}
function doAct(){
  const n = +document.getElementById('actN').value;
  let r;
  if(mode === 'attack') r = E.attack(G, playAs, selZone, target, n, { warcry: !!(document.getElementById('optWar') || {}).checked, naval: !!(document.getElementById('optNav') || {}).checked, forceDice });
  else r = E.move(G, playAs, selZone, target, n, { march: !!(document.getElementById('optMarch') || {}).checked });
  if(after(r)){ const t = target; mode = null; target = null; if(r.entry.captured){ selZone = t; } board.select(selZone, []); renderZone(); }
}
function joinNow(){ after(E.joinLate(G, { id: me.id, name: me.name })); playAs = me.id; refreshUI(); }

// ---------- sign-ups ----------
function renderSignup(){
  const el = document.getElementById('signup');
  if(G.phase !== 'signup'){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const mine = G.signups.some(s => s.id === me.id);
  document.getElementById('signupCard').innerHTML = `<h2 style="font-family:Cinzel;color:var(--gold);margin-top:0">Guild War · Sign-ups</h2>
    <div class="muted">Sign-ups run Sunday 8pm to midnight. At midnight the teams are drafted (snake draft by activity) and the war runs Monday to Sunday 8pm.</div>
    <div id="signupList">${G.signups.map(s => `<div>• ${esc(s.name)}${s.bot ? '<span class="tag">bot</span>' : ''}</div>`).join('') || '<div class="muted">Nobody yet</div>'}</div>
    <div class="row">${mine ? '<span class="chip">✔ You are signed up</span>' : '<button class="btn" onclick="doSignup()">Sign me up</button>'}
      ${me.admin ? `<button class="btn sm" onclick="addBots(5)">+5 bots</button><button class="btn sm" onclick="startWar()">Start the war (draft) ▶</button>` : ''}</div>`;
}
function doSignup(){ E.signup(G, { id: me.id, name: me.name, activity: 50 }); save(); refreshUI(); }
const BOT_NAMES = ['Grommash', 'Jaina', 'Thrall', 'Varian', 'Sylvanas', 'Tyrande', 'Cairne', 'Magni', 'Vol\'jin', 'Malfurion', 'Rexxar', 'Muradin', 'Garrosh', 'Anduin', 'Baine', 'Genn', 'Lor\'themar', 'Velen', 'Gallywix', 'Gelbin'];
function addBots(n){
  for(let i = 0; i < n; i++){
    const used = new Set(G.signups.map(s => s.name).concat(Object.values(G.players).map(p => p.name)));
    const name = BOT_NAMES.find(x => !used.has(x)) || ('Bot ' + (G.signups.length + 1));
    const id = 'bot-' + Math.random().toString(36).slice(2, 8);
    if(G.phase === 'signup') E.signup(G, { id, name, activity: Math.floor(Math.random() * 100), bot: true });
    else E.joinLate(G, { id, name, bot: true });
  }
  save(); refreshUI();
}
function startWar(){
  const r = E.startGame(G); if(!r.ok){ toast(r.error); return; }
  if(!G.players[playAs]) playAs = G.players[me.id] ? me.id : Object.keys(G.players)[0];
  save(); refreshUI();
  G.log.filter(e => e.seq > seen()).forEach(e => queue.push(e)); runQueue();
}

// ---------- bots: a simple aggressive AI for sandbox testing ----------
function runBots(){
  const ids = Object.values(G.players).filter(p => p.bot).map(p => p.id).sort(() => Math.random() - 0.5);   // a different bot goes first each time, so no one bot always gets first pick of the ready troops
  if(!ids.length){ toast('No bots in this war'); return; }
  ids.forEach(id => (botTurn(id) || []).forEach(e => queue.push(e)));
  save(); refreshUI(); runQueue();
}

// ---------- admin sandbox ----------
function toggleAdmin(){ const a = document.getElementById('admin'); a.style.display = a.style.display === 'block' ? 'none' : 'block'; if(a.style.display === 'block') renderAdmin(); }
function renderAdmin(){
  const el = document.getElementById('admin');
  const opts = Object.values(G.players).map(p => `<option value="${p.id}" ${p.id === playAs ? 'selected' : ''}>${esc(p.name)} (${p.faction}${p.bot ? ', bot' : ''})</option>`).join('');
  const z = selZone ? G.zones[selZone] : null;
  el.innerHTML = `<h3>Admin sandbox</h3>
    <div class="muted">This is a local test war (saved in this browser). Nothing here touches the live site.</div>
    <div class="row">Play as <select onchange="playAs=this.value;refreshUI()">${opts || '<option>nobody yet</option>'}</select></div>
    <div class="row"><button class="btn sm" onclick="addBots(1)">+1 bot</button><button class="btn sm" onclick="addBots(5)">+5 bots</button><button class="btn sm" onclick="runBots()">🤖 Bots take their turn</button></div>
    <div class="row"><label><input type="checkbox" ${G.settings.unlimitedAP ? 'checked' : ''} onchange="G.settings.unlimitedAP=this.checked;save();refreshUI()"> Unlimited AP</label>
      <button class="btn sm" onclick="giveRes()">+5 of each resource</button><button class="btn sm" onclick="giveCards()">+1 each card</button><button class="btn sm" onclick="giveTroops()">+10 troops</button></div>
    <div class="row">Dice <select onchange="forceDice=this.value"><option value="">Fair</option><option value="att" ${forceDice === 'att' ? 'selected' : ''}>Attacker always wins</option><option value="def" ${forceDice === 'def' ? 'selected' : ''}>Defender always wins</option></select></div>
    <div class="row"><button class="btn sm" onclick="advanceDay()">☀ Advance a day</button><button class="btn sm" onclick="advanceHours(6)">+6 hours</button></div>
    <div class="row">Phase: <b>${G.phase}</b> <button class="btn sm" onclick="jumpPhase('signup')">→ Sign-ups</button>${G.phase === 'signup' ? '<button class="btn sm" onclick="startWar()">→ Start</button>' : ''}${G.phase === 'live' ? '<button class="btn sm" onclick="endWar()">→ End war</button>' : ''}</div>
    ${z ? `<div style="border-top:1px solid var(--edge);margin-top:6px;padding-top:6px"><b>Edit ${ZN(selZone)}</b>
      <div class="row">Owner <select id="edO">${['horde', 'alliance', 'neutral'].map(o => `<option ${z.owner === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
      Ready <input type="number" id="edR" value="${z.ready}" style="width:52px"> Fresh <input type="number" id="edF" value="${z.fresh}" style="width:52px"></div>
      <div class="row">Building <select id="edB">${['None', 'Outpost', 'Stronghold'].map((o, i) => `<option value="${i}" ${z.outpost === i ? 'selected' : ''}>${o}</option>`).join('')}</select>
      <button class="btn sm" onclick="editZone()">Apply</button></div></div>` : '<div class="muted">Select a zone to edit it.</div>'}
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="replayAll()">⟲ Replay whole war</button><button class="btn sm red" onclick="resetWar()">Reset sandbox</button></div>
    <div class="row"><button class="btn sm" onclick="testBattle()">🎬 Demo battle animation</button></div>`;
}
function giveRes(){ const p = cur(); if(!p) return; ['food', 'wood', 'ore', 'gold'].forEach(r => { p.res[r] += 5; }); save(); refreshUI(); }
function giveCards(){ const p = cur(); if(!p) return; Object.keys(p.cards).forEach(k => { p.cards[k]++; }); save(); refreshUI(); }
function giveTroops(){ const p = cur(); if(!p) return; p.reinforce += 10; save(); refreshUI(); }
function advanceDay(){
  if(G.phase !== 'live'){ toast('Start the war first'); return; }
  const from = G.seq;
  // Sunday is the last day: advancing past it reaches Sunday 8pm and ends the war
  if(E.day(G) >= 6){ G.clock = E.RULES.endClock; toast('Sunday 8pm: the war ends'); E.endGame(G); setTimeout(showEndScreen, 600); }
  else E.beginDay(G);
  save(); refreshUI(); G.log.filter(e => e.seq > from).forEach(e => queue.push(e)); runQueue();
}
function advanceHours(h){
  if(G.phase === 'live' && G.clock + h >= E.RULES.endClock){ G.clock = E.RULES.endClock; const from = G.seq; E.endGame(G); toast('Sunday 8pm: the war ends'); save(); refreshUI(); G.log.filter(e => e.seq > from).forEach(e => queue.push(e)); runQueue(); return; }
  G.clock += h; if(E.day(G) > E.day({ clock: G.clock - h })){ G.clock -= h; advanceDay(); return; } save(); board.setState(JSON.parse(JSON.stringify(G))); refreshUI(); }
function jumpPhase(ph){ if(ph === 'signup' && !confirm('Go back to sign-ups? This wipes the board (sign-ups are kept).')) return; const s = G.signups; G = E.newGame({ sandbox: true }); G.signups = s; save(); if(board.smashed){ location.reload(); return; } chatMsgs = []; loadChat(); markSeen(G.seq); board.setState(JSON.parse(JSON.stringify(G))); refreshUI(); }
function endWar(){ after(E.endGame(G)); setTimeout(showEndScreen, 600); }

// ---------- war over: Victory / Defeat, with each champion's part in it ----------
// personal score: 5 per zone captured, 1 per enemy troop killed, 3 per outpost, 6 per stronghold, 1 per fortify
const playerStats = () => WarAI.playerStats(G, G.log);
const botTurn = pid => WarAI.botTurn(E, G, pid);
// ---------- the champion's smash ----------
// The winning side's top scorer may smash the board any time from the end of the war until the next war starts.
// Hits are kept with the game (and sent live to everyone watching), so anyone opening the room later sees the wreckage.
function champion(){
  if(G.phase !== 'ended' || !G.result) return null;
  const st = Object.values(playerStats()), win = G.result.winner;
  const pool = win === 'draw' ? st : st.filter(s => s.p.faction === win);
  const best = pool.sort((a, b) => b.score - a.score)[0];
  return best && best.score > 0 ? best.p : null;
}
const canSmash = () => { const c = champion(); return !!(c && cur() && cur().id === c.id); };
function smashNote(){
  const c = champion(); if(!c) return '';
  const n = (G.smash || []).length;
  return `<div class="smashNote">👑 ${esc(c.name)} has earned the right to smash the board until the next war begins.${n ? ` (${n} blow${n > 1 ? 's' : ''} landed so far)` : ''}</div>`;
}
let smashCh = null;
function smashChannel(){
  if(smashCh || !me || !me.signedIn) return smashCh;
  smashCh = sb.channel('guild-war-smash', { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'hit' }, ({ payload }) => {
      if(!payload || payload.gid !== G.id || !payload.hit) return;
      (G.smash = G.smash || []).push(payload.hit); save();
      const c = champion(); board.loadWeapons(); board.swingAt(0, 0, c ? c.faction : 'horde', new THREE.Vector3(payload.hit.x, 0, payload.hit.z)); setTimeout(() => board.smashHit(payload.hit, true), 300);
    }).subscribe();
  return smashCh;
}
function startSmash(){
  if(!canSmash()) return;
  document.getElementById('endScreen').classList.remove('show');
  document.body.classList.add('smashing'); board.smashMode = true;
  ['me', 'zone', 'feed', 'chat'].forEach(id => { const e = document.getElementById(id); if(e) e.dataset.was = e.style.display, e.style.display = 'none'; });
  const bar = document.getElementById('smashBar'); bar.style.display = 'flex';
  document.getElementById('smashTxt').textContent = `${cur().faction === 'alliance' ? '🔨' : '🪓'} Click the board to smash it!`;
  board.overview(700); smashChannel(); board.loadWeapons();
}
function stopSmash(){
  document.body.classList.remove('smashing'); board.smashMode = false;
  ['me', 'zone', 'feed', 'chat'].forEach(id => { const e = document.getElementById(id); if(e && e.dataset.was !== undefined) e.style.display = e.dataset.was; });
  document.getElementById('smashBar').style.display = 'none';
  refreshUI();
}
function smashClick(x, y){
  if(!board.smashMode || !canSmash()) return;
  const at = board.pointOnTable(x, y); if(!at) return;
  G.smash = G.smash || []; if(!G.smashStart) G.smashStart = Date.now();
  const hit = { x: +at.x.toFixed(3), z: +at.z.toFixed(3), power: +(0.8 + Math.random() * 0.5).toFixed(2), seed: Math.floor(Math.random() * 1e9), t: +((Date.now() - G.smashStart) / 1000).toFixed(2) };
  G.smash.push(hit); save();
  board.swingAt(x, y, cur().faction, at);
  setTimeout(() => board.smashHit(hit, true), 300);   // the blow lands as the weapon comes down
  const ch = smashChannel(); if(ch) ch.send({ type: 'broadcast', event: 'hit', payload: { gid: G.id, hit } });
}

function showEndScreen(){
  if(G.phase !== 'ended' || !G.result) return;
  const r = G.result, st = playerStats(), win = r.winner;
  const side = f => {
    const lost = win !== 'draw' && win !== f;
    const rows = Object.values(st).filter(s => s.p.faction === f).sort((a, b) => b.score - a.score);
    const top = rows.length ? rows[0].score : -1;
    return `<div class="endSide ${f} ${lost ? 'lost' : ''}">
      <div class="banner l">${TROOP_ICON(f)}</div><div class="banner r">${TROOP_ICON(f)}</div>
      <div class="flagStage l" data-f="${f}" data-lost="${lost ? 1 : 0}"></div><div class="flagStage r" data-f="${f}" data-lost="${lost ? 1 : 0}" data-flip="1"></div>
      ${lost ? '' : `<div class="embers">${Array.from({ length: 22 }, () => `<i style="left:${Math.random() * 100}%;--dx:${(Math.random() - 0.5) * 80}px;animation-duration:${3 + Math.random() * 4}s;animation-delay:${Math.random() * 5}s"></i>`).join('')}</div>`}
      <div class="crestBig">${TROOP_ICON(f)}</div>
      <div class="verdict">${win === 'draw' ? 'Stalemate' : lost ? 'Defeat' : 'Victory'}</div>
      <div class="facName">${f === 'horde' ? 'The Horde' : 'The Alliance'}</div>
      <div class="final">${r.score[f].total} <small>WAR SCORE</small></div>
      <table class="roster"><tr><th>Champion</th><th class="n">Captures</th><th class="n">Kills</th><th class="n">Builds</th><th class="n">Score</th></tr>
        ${rows.map(s => `<tr class="${s.score === top && top > 0 ? 'mvp' : ''}"><td>${esc(s.p.name)}${s.p.bot ? ' <span class="tag">bot</span>' : ''}</td><td class="n">${s.caps}</td><td class="n">${s.kills}</td><td class="n">${s.builds}</td><td class="n sc">${s.score}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No champions</td></tr>'}
      </table></div>`;
  };
  const order = win === 'alliance' ? ['alliance', 'horde'] : ['horde', 'alliance'];
  const el = document.getElementById('endScreen');
  el.innerHTML = `<div class="endWrap"><div class="endTitle">THE WAR IS OVER</div><div class="endHead">${E.day(G) + 1} days of fighting</div>
    <div class="endCols">${order.map(side).join('')}</div>
    ${smashNote()}
    <div class="endBtns">${canSmash() ? '<button class="btn" style="border-color:#ffd36a;color:#ffd36a" onclick="startSmash()">⚒ Smash the board</button>' : ''}<button class="btn" onclick="document.getElementById('endScreen').classList.remove('show')">View the board</button><button class="btn" onclick="location.href='index.html'">← Back to site</button></div></div>`;
  el.classList.add('show');
  endFlags();
}
// the faction banner models from the board, waving on the result cards: the victor's stand tall in a warm light,
// the defeated side's droop and hang low
let endFlagLoop = null;
function endFlags(){
  if(endFlagLoop) cancelAnimationFrame(endFlagLoop);
  const fm = board && board.flagModels; if(!fm || !THREE.SkeletonUtils) return;
  const stages = [...document.querySelectorAll('#endScreen .flagStage')].filter(s => fm[s.dataset.f]);
  const scenes = stages.map(st => {
    st.closest('.endSide').classList.add('has3d');
    const lost = st.dataset.lost === '1', flip = !!st.dataset.flip;
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio || 1)); r.outputEncoding = THREE.sRGBEncoding;
    r.setSize(st.clientWidth, st.clientHeight); st.appendChild(r.domElement);
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, st.clientWidth / st.clientHeight, 0.01, 10);
    cam.position.set(0, 0.3, 0.95); cam.lookAt(0, 0.26, 0);
    scene.add(new THREE.HemisphereLight(0xfff0d8, 0x302018, lost ? 0.85 : 1.0));
    const key = new THREE.DirectionalLight(lost ? 0xb8bccb : 0xffd08a, lost ? 1.0 : 1.5); key.position.set(0.3, 0.8, 1.4); scene.add(key);
    const f = fm[st.dataset.f], flag = THREE.SkeletonUtils.clone(f.proto);
    const holder = new THREE.Group(); holder.add(flag); scene.add(holder);
    holder.scale.setScalar(1.25); if(flip) holder.scale.x *= -1; holder.position.x = flip ? 0.12 : -0.12;   // the right-hand flag mirrors the left
    if(lost){ holder.rotation.z = flip ? 0.35 : -0.35; holder.position.y = -0.06; }
    // frame the whole flag (pole + cloth) whatever its proportions
    holder.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(holder), c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
    const fit = Math.max(sz.y, sz.x * cam.aspect ** -1) * 0.62 / Math.tan(cam.fov * Math.PI / 360);
    cam.position.set(c.x, c.y + sz.y * 0.05, c.z + fit); cam.lookAt(c.x, c.y, c.z);
    let mixer = null;
    if(f.clip){ mixer = new THREE.AnimationMixer(flag); const a = mixer.clipAction(f.clip); a.play(); a.timeScale = lost ? 0.35 : 1; a.time = Math.random() * f.clip.duration; }
    return { r, scene, cam, mixer, holder, lost, flip };
  });
  let last = performance.now();
  const loop = now => {
    if(!document.getElementById('endScreen').classList.contains('show')){ scenes.forEach(s => s.r.dispose()); endFlagLoop = null; return; }
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    scenes.forEach(s => { if(s.mixer) s.mixer.update(dt); if(!s.lost) s.holder.rotation.y = Math.sin(now / 1800) * 0.12; s.r.render(s.scene, s.cam); });
    endFlagLoop = requestAnimationFrame(loop);
  };
  endFlagLoop = requestAnimationFrame(loop);
}
function editZone(){
  const z = G.zones[selZone];
  z.owner = document.getElementById('edO').value; z.ready = Math.max(0, +document.getElementById('edR').value); z.fresh = Math.max(0, +document.getElementById('edF').value);
  z.outpost = +document.getElementById('edB').value; save(); board.setState(JSON.parse(JSON.stringify(G))); refreshUI();
}
function resetWar(){ if(!confirm('Reset the sandbox war completely?')) return; G = E.newGame({ sandbox: true }); save(); if(board.smashed){ location.reload(); return; } markSeen(0); chatMsgs = []; loadChat(); selZone = null; board.select(null, []); board.setState(JSON.parse(JSON.stringify(G))); refreshUI(); }
function replayAll(){
  // rewind the board to the start and play every move again
  const view = JSON.parse(JSON.stringify(G));
  const evs = G.log.filter(e => e.type !== 'signup' && e.type !== 'start');
  for(let i = evs.length - 1; i >= 0; i--){ const e = evs[i]; if(e.zones) Object.keys(e.zones).forEach(k => { view.zones[k] = JSON.parse(JSON.stringify(e.zones[k].before)); }); }
  board.setState(view); queue = evs.slice(); runQueue();
}
// A scripted battle on a scratch copy, for checking the camera and the dice without touching the war
function testBattle(){
  const S = JSON.parse(JSON.stringify(G));
  if(S.phase !== 'live'){ toast('Start the war first'); return; }
  const p = Object.values(S.players)[0]; const f = p.faction;
  const from = E.zonesOf(S, f).find(k => [...E.ADJ[k]].some(n => S.zones[n].owner !== f)); if(!from){ toast('No frontier'); return; }
  const to = [...E.ADJ[from]].find(n => S.zones[n].owner !== f);
  S.zones[from].ready = 12; S.settings.unlimitedAP = true;
  const r = E.attack(S, p.id, from, to, 11, { warcry: false }); if(!r.ok){ toast(r.error); return; }
  board.state.zones[from] = JSON.parse(JSON.stringify(r.entry.zones[from].before)); board.syncPiece(from);
  board.play(r.entry).then(() => setTimeout(() => board.setState(JSON.parse(JSON.stringify(G))), 1200));
}
